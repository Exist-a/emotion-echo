Name: assessment-api
Host: 0.0.0.0
Port: 8889

# Stage 26-P:容器内服务发现(env 占位)
SkyWalking:
  OAPAddr:     ${SKYWALKING_OAP_ADDR:-emotion-echo-sw-oap:11800}
  ServiceName: emotion-echo-assessment-svc
  Enabled:     true

Postgres:
  DSN:          ${POSTGRES_DSN:-"host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_assessment"}
  MaxOpenConns: 10
  MaxIdleConns: 5

# Stage 31 PR-09: Nacos 注册中心 + 配置中心
Nacos:
  Enabled:   ${NACOS_ENABLED:-true}
  Addr:      ${NACOS_ADDR:-emotion-echo-nacos:8848}
  Namespace: ${NACOS_NAMESPACE:-emotion-echo-dev}
  GroupName: DEFAULT_GROUP
  HotReload: ${NACOS_HOT_RELOAD:-false}
