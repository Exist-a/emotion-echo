name: doc-drift-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CL-00（2026-10-13）CI 瘦身：
#   第 1 刀：原 24 个独立 job（各起一个 runner）→ 合并为 1 个 `static-guards` job。
#   第 2 刀：删冗余检查（见下），保留汇总 job `doc-drift-gate`（名「文档守卫总闸」）
#           ⇒ 分支保护 required check 名不变。
#   被删检查的脚本**文件保留**（仍被 docs 引用，删了会留悬空引用；orphan-outputs 不判红）。
jobs:
  static-guards:
    name: 静态守卫（合并）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tdd-gate / adr-gate 需要全历史
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: 工具链自检
        run: |
          bash --version | head -1
          python --version
          node --version
          go version
      # CL-00：合并后统一用 setup-python 的干净 python（原 helm 渲染 job 用系统 python
      # 自带 pyyaml），须显式补 pyyaml —— 见第 1 刀回归修复。
      - name: 安装 python 依赖（pyyaml）
        run: python -m pip install --quiet pyyaml

      # ---- 路径 / 契约 / 卫生 ----
      - name: 1 路径对齐（前端 ⊆ BFF）
        run: bash scripts/check_routes_alignment.sh
      - name: 2 视图定义一致性
        run: python scripts/check_view_consistency.py
      - name: 3 环境变量 lint
        run: bash scripts/lint_env_vars.sh
      - name: 4 YAML 字面值收紧
        run: python scripts/yaml_lint.py
      - name: 5 仓库布局自检
        run: python scripts/check_git_layout.py --strict
      - name: 5b 布局自检的回归钉（worktree 场景，CL-F-06）
        run: python scripts/test_check_git_layout.py
      - name: 6 Dockerfile digest pin
        run: bash scripts/check_docker_digests.sh
      - name: 7 BFF JWT secret 一致性
        run: bash scripts/test_bff_jwt_secret.sh
      - name: 8 Migration 契约
        run: bash scripts/test_migrations_contract.sh
      - name: 9 Migration 服务顺序独立性
        run: bash scripts/test_migrations_no_service_order.sh
      - name: 10 soft-assert 扫描（含负向自检）
        run: |
          bash scripts/check_soft_asserts.sh
          bash scripts/test_check_soft_asserts.sh
      - name: 11 APISIX seed 结构 + drift 契约
        run: |
          node deploy/apisix/seed_test.js
          node scripts/test_apisix_drift_lib.js
          bash scripts/test_check_apisix_drift.sh
      - name: 12 明文密钥扫描（含负向自检）
        run: |
          bash scripts/check_secrets.sh
          bash scripts/test_check_secrets.sh
      - name: 13 TDD 门禁
        run: bash scripts/check_tdd_gate.sh
      - name: 14 ADR 门禁（仅 PR）
        if: github.event_name == 'pull_request'
        env:
          CI_COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: bash scripts/check_adr_gate.sh
      - name: 15 残留物扫描
        run: bash scripts/check_residual.sh
      - name: 16 ctx 日志门禁
        run: python scripts/check_ctx_logging.py
      - name: 17 孤儿产出物检测
        run: bash scripts/check_orphan_outputs.sh
      - name: 18 观测面配置契约
        run: node deploy/obs_monitoring.test.js
      # CL-06 Phase 0（账本 CL-F-28）：web Dockerfile 契约此前**存在但没接线** ——
      # 没有任何 workflow 引用它，所以它既不会红也不会拦。而它自身还有"命中注释"的假绿
      # （断言 `npm ci` 命中的是注释，真实命令是 `npm install`）。两步都放在这里：
      # 契约 + 负向自检（注释不得充当证据）。
      - name: 19 web Dockerfile 契约（pnpm 权威锁 + 注释不得充当证据）
        run: |
          python scripts/test_web_dockerfile_p0r28_r29.py
          python scripts/test_web_dockerfile_p0r28_r29.py --selftest

  # 汇总门禁（名「文档守卫总闸」= 分支保护的 required check，**名字不能改**）。
  doc-drift-gate:
    name: 文档守卫总闸
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static-guards]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: 汇总全部检查结果
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          echo "$NEEDS_JSON" | bash scripts/check_doc_drift_gate_result.sh
