name: doc-drift-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CL-00（2026-10-13）CI 瘦身 —— 第 1 刀：合并 job
#   原 24 个独立 job（每个各起一个 runner、各 checkout 一次）合并为 **1 个 job**，
#   大幅降低 runner 冷启动 + 排队开销；**覆盖不减**（每个 job 的脚本一字未动，
#   只是从"各自一个 runner"变成"同一 runner 顺序跑"）。
#   保留汇总 job `doc-drift-gate`（名「文档守卫总闸」）——**分支保护的 required check
#   名不变**（用户 2026-10-13 确认 main 开着 required checks）。
#   随之删除已成空壳的 `doc-drift-needs-sync`（它只在"多 job + 硬编码 needs 列表"时才有意义）。
jobs:
  static-guards:
    name: 静态守卫（合并）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tdd-gate / adr-gate 需要全历史
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: azure/setup-helm@v4
      - name: 工具链自检
        run: |
          bash --version | head -1
          python --version
          node --version
          go version
          helm version --short

      # ---- 路径 / 契约 / 卫生 ----
      - name: 1 路径对齐（前端 ⊆ BFF）
        run: bash scripts/check_routes_alignment.sh
      - name: 2 视图定义一致性
        run: python scripts/check_view_consistency.py
      - name: 3 环境变量 lint
        run: bash scripts/lint_env_vars.sh
      - name: 4 YAML 字面值收紧
        run: python scripts/yaml_lint.py
      - name: 5 仓库布局自检
        run: python scripts/check_git_layout.py --strict
      - name: 6 Dockerfile digest pin
        run: bash scripts/check_docker_digests.sh
      - name: 7 文档更新验证
        run: bash scripts/test_docs_update.sh
      - name: 8 BFF JWT secret 一致性
        run: bash scripts/test_bff_jwt_secret.sh
      - name: 9 user_oauth 零引用
        run: bash scripts/test_user_oauth_zero_ref.sh
      - name: 10 Migration 契约
        run: bash scripts/test_migrations_contract.sh
      - name: 11 Migration 服务顺序独立性
        run: bash scripts/test_migrations_no_service_order.sh
      - name: 12 soft-assert 扫描（含负向自检）
        run: |
          bash scripts/check_soft_asserts.sh
          bash scripts/test_check_soft_asserts.sh
      - name: 13 APISIX seed 结构 + drift 契约
        run: |
          node deploy/apisix/seed_test.js
          node scripts/test_apisix_drift_lib.js
          bash scripts/test_check_apisix_drift.sh
      - name: 14 明文密钥扫描（含负向自检）
        run: |
          bash scripts/check_secrets.sh
          bash scripts/test_check_secrets.sh
      - name: 15 E2E 收口审计
        run: python scripts/e2e_stage_audit.py --all
      - name: 16 TDD 门禁
        run: bash scripts/check_tdd_gate.sh
      - name: 17 ADR 门禁（仅 PR）
        if: github.event_name == 'pull_request'
        env:
          CI_COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: bash scripts/check_adr_gate.sh
      - name: 18 残留物扫描
        run: bash scripts/check_residual.sh
      - name: 19 Loki chart 渲染回归
        run: bash scripts/test_helm_loki_render.sh
      - name: 20 ctx 日志门禁
        run: python scripts/check_ctx_logging.py
      - name: 21 孤儿产出物检测
        run: bash scripts/check_orphan_outputs.sh
      - name: 22 Prometheus chart 渲染回归
        run: bash scripts/test_helm_prometheus_render.sh
      - name: 23 主 chart 渲染回归
        run: bash scripts/test_helm_main_render.sh
      - name: 24 观测面配置契约
        run: node deploy/obs_monitoring.test.js

  # 汇总门禁（名「文档守卫总闸」= 分支保护的 required check，**名字不能改**）。
  # 它 needs 全部检查，任一失败即失败；`if: always()` 防"上游失败时本 job 被 skip ⇒ 不拦"。
  doc-drift-gate:
    name: 文档守卫总闸
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static-guards]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: 汇总全部检查结果
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          echo "$NEEDS_JSON" | bash scripts/check_doc_drift_gate_result.sh
