name: doc-drift-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# E2E-F-56：本 workflow 原先缺 timeout-minutes/concurrency/permissions
#（另 3 个 workflow 早已具备）。补最小权限，避免默认 token 权限过宽。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routes-alignment:
    name: 路径对齐（前端 ⊆ BFF）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check routes alignment
        run: bash scripts/check_routes_alignment.sh

  view-consistency:
    name: 视图定义一致性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check view consistency
        run: python scripts/check_view_consistency.py

  env-vars-lint:
    name: 环境变量 lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint env vars
        run: bash scripts/lint_env_vars.sh

  yaml-lint:
    name: YAML 字面值收紧
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: YAML lint
        run: python scripts/yaml_lint.py

  git-layout:
    name: 仓库布局自检
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check git layout
        run: python scripts/check_git_layout.py --strict

  docker-digests:
    name: Dockerfile digest pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile digests
        run: bash scripts/check_docker_digests.sh

  docs-update:
    name: 文档更新验证
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test docs update
        run: bash scripts/test_docs_update.sh

  bff-jwt-secret:
    name: BFF JWT secret 一致性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check BFF JWT secret
        run: bash scripts/test_bff_jwt_secret.sh

  user-oauth-zero-ref:
    name: user_oauth 零引用
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check user_oauth zero ref
        run: bash scripts/test_user_oauth_zero_ref.sh

  migrations-contract:
    name: Migration 契约
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test migrations contract
        run: bash scripts/test_migrations_contract.sh

  migrations-no-service-order:
    name: Migration 服务顺序独立性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test migrations no service order
        run: bash scripts/test_migrations_no_service_order.sh

  soft-assert-scan:
    name: soft-assert 扫描（被注释的断言）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan for soft asserts
        run: bash scripts/check_soft_asserts.sh
      - name: Self-test the scanner (负向用例)
        run: bash scripts/test_check_soft_asserts.sh

  apisix-seed-structure:
    name: APISIX seed 结构断言
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # deploy/apisix/seed_test.js 是可运行的离线结构断言（node，无依赖），
      # 但此前**从未接入 CI** —— 2026-09-18 改 seed.sh 的默认值时把它弄红了，
      # 却因为没人跑而无人发现（测试不接 CI 等于没有测试）。
      - name: seed.sh structural assertions
        run: node deploy/apisix/seed_test.js

  secrets-scan:
    name: 明文密钥扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan for plaintext secrets
        run: bash scripts/check_secrets.sh
      - name: Self-test the scanner (负向用例)
        run: bash scripts/test_check_secrets.sh

  # === 波 2 新增：5 个收口门禁（debt-paydown-plan 波 2） ===

  e2e-stage-audit:
    name: E2E 收口审计
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run stage auditor
        run: python scripts/e2e_stage_audit.py --all

  tdd-gate:
    name: TDD 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check TDD compliance
        run: bash scripts/check_tdd_gate.sh

  adr-gate:
    name: ADR 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ADR compliance
        run: bash scripts/check_adr_gate.sh

  residual-scan:
    name: 残留物扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan for residual artifacts
        run: bash scripts/check_residual.sh

  orphan-outputs:
    name: 孤儿产出物检测
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for orphan outputs
        run: bash scripts/check_orphan_outputs.sh
