name: go-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - emotion-echo-ai-svc
          - emotion-echo-analytics-svc
          - emotion-echo-chat-svc
          - emotion-echo-web-bff
          - emotion-echo-assessment-svc
          - emotion-echo-user-svc
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: '${{ matrix.service }}/go.mod'
          cache: true
          cache-dependency-path: '${{ matrix.service }}/go.sum'
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  shared-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: emotion-echo-shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'emotion-echo-shared/go.mod'
          cache: true
          cache-dependency-path: 'emotion-echo-shared/go.sum'
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
