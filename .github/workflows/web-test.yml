name: web-test

on:
  push:
    branches: [main]
    paths:
      - 'emotion-echo-web/**'
      - '.github/workflows/web-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'emotion-echo-web/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: emotion-echo-web

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'emotion-echo-web/pnpm-lock.yaml'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: vitest
        run: pnpm vitest run
      # E2E-04 #4 原为假 PASS（声称 typecheck 已接入 CI，实际没有）。
      # 此处接入使其成真；本 workflow 有 paths 过滤，故不列入 required checks（D-08）。
      - name: Typecheck
        run: pnpm typecheck
