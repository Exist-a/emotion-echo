name: llm-test

on:
  push:
    branches: [main]
    paths:
      - 'emotion-llm-service/**'
      - 'docs/ci-workflows/llm-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'emotion-llm-service/**'

defaults:
  run:
    working-directory: emotion-llm-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: pytest
        run: python -m pytest tests/unit/ -v