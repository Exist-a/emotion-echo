Name: emotion-echo-analytics-svc
Host: 0.0.0.0
Port: 8893  # Stage 26-P:避开 ai-svc 占用的 8892

# Stage 36-A1.3:容器内服务发现
#
# 历史（Stage 26-P）使用 ${VAR:-default} 占位符，但 go-zero conf 不解析该语法（Stage 22-B
# 已确认），字面 ${...} 会被当成 host 字面值传给 go2sky / sarama / postgres driver，
# 导致 "too many colons in address" / "missing port in address" 错误循环。
# 现改为字面默认值，runtime env 覆盖由 main.go applyEnvOverrides 负责。

SkyWalking:
  OAPAddr:     localhost:11800
  ServiceName: emotion-echo-analytics-svc
  # Enabled: 省略 → Config struct tag default=false；env SKYWALKING_ENABLED 由 main.go 注入

Postgres:
  DSN:          "host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_analytics"
  MaxOpenConns: 10
  MaxIdleConns: 5

# Stage 30-B: chat-events consumer（user_behavior_events 数据源）
# broker 不可达时 consumer 5s 重试 + warn，不 crash
Kafka:
  BrokersCSV: localhost:9092
  GroupID:    analytics-svc
  # Enabled: 省略 → Config struct tag default=true（consumer 是 analytics-svc 唯一数据源）
  Topics:     ["chat-events"]

# Stage 31 PR-09: Nacos 注册中心 + 配置中心
# Stage 36-A1.3：与 user-svc / chat-svc / ai-svc 一致——yaml 不再含 ${NACOS_*} 占位符，
# env 覆盖由 main.go applyEnvOverrides 完成。
Nacos:
  # Enabled: 省略 → Config struct tag default=true
  Addr:      emotion-echo-nacos:8848
  Namespace: emotion-echo-dev
  GroupName: DEFAULT_GROUP
  # HotReload: 省略 → Config struct tag default=false

