Name: emotion-echo-ai-svc
Host: 0.0.0.0
Port: 8891

# Stage 20-P0-1: 容器内服务发现
# 外部依赖的 string 地址通过 env 注入
# list 字段（Kafka.Brokers）改用 BrokersCSV（string），main.go 启动时 split
#
# 容器里跑时，compose 的 environment 会注入：
#   POSTGRES_DSN       — Postgres host 用容器名 emotion-echo-postgres
#   KAFKA_BROKERS      — 单个 broker，如 "emotion-echo-kafka:9092"
#   KAFKA_ENABLED      — "true"/"false"
#   SKYWALKING_OAP_ADDR — 形如 emotion-echo-sw-oap:11800
#   SKYWALKING_ENABLED — "true"/"false"
#   LLM_BASE_URL       — 形如 http://emotion-llm-service:8000
#   LLM_MODEL          — 模型名
#   LLM_TIMEOUT        — 超时秒数
#   LLM_GRPC_ADDR      — 形如 emotion-llm-service:50051
#   INTERNAL_API_KEY — gRPC auth key（P0-R2-5: 统一 env 名；Round 3.5：AI_LLM_INTERNAL_API_KEY 优先）
#   LLM_BREAKER_FAIL_THRESHOLD — 连续失败次数
#   LLM_BREAKER_OPEN_SECONDS   — Open 持续秒数
#   NACOS_ENABLED      — "true"/"false"
#   NACOS_ADDR         — Nacos 地址
#   NACOS_NAMESPACE    — 命名空间
#   NACOS_HOT_RELOAD   — "true"/"false"
#   WORKER_TICK_INTERVAL — FusionWorker tick 秒数
#
# Round 4.6 P1-26 收紧：所有 ${VAR:-default} 字面默认值已移除 → ${VAR} 形式。
# 缺省值由 main.go applyEnvOverrides（env） + applyDefaultFallbacks（infra only，
# 不再包含业务依赖字段 silent localhost fallback）控制。
# 本地开发：必须显式 export env；否则 applyDefaultFallbacks 启动 fail-fast
# （修复"dev 拼通的 prod 配置"漂移风险）。

SkyWalking:
  OAPAddr:     ${SKYWALKING_OAP_ADDR}
  ServiceName: emotion-echo-ai-svc
  # Enabled: 省略 → 走 Config struct tag `json:",default=false"`；env 注入由 main.go applyEnvOverrides

Postgres:
  DSN:          ${POSTGRES_DSN}
  MaxOpenConns: 10
  MaxIdleConns: 5

Kafka:
  BrokersCSV: ${KAFKA_BROKERS}
  GroupID:    ai-svc
  # Enabled: 省略 → Config default=true
  Topics:     ["chat-events"]
  DLQTopic:   chat-events-dlq
  MaxRetries: 3

LLM:
  BaseURL:        ${LLM_BASE_URL}
  GRPCAddr:       ${LLM_GRPC_ADDR}
  InternalAPIKey: ${INTERNAL_API_KEY}
  Model:          ${LLM_MODEL}
  Enabled:        true
  # Timeout: 省略 → Config struct tag default=3；env LLM_TIMEOUT 由 main.go applyEnvOverrides 注入
  Timeout:        3

GRPC:
  Enabled: true   # Stage 19: ai-svc gRPC server (:8892)
  Port:    8892

# Stage 22-A: 多模态 AI 模型服务（可选）
# BaseURL 留空 = 不调用，由 analyzer / consumer 走降级路径（仅文本 LLM）。
# 启用 AI profile 后，compose 文件会注入容器 DNS 名（emotion-echo-fer:8004 等）。
# Round 4.6 收紧：BaseURL 仍可空（可选服务），由 main.go applyDefaultFallbacks 检查
# （dev 必须显式 export FER_BASE_URL 等，否则报错，避免 silent localhost fallback）。
FER:
  BaseURL: ""
  Timeout: 10

SenseVoice:
  BaseURL: ""
  Timeout: 30

XTTS:
  BaseURL: ""
  Timeout: 60
  Language: zh-cn
  Speed: 0.75

# Stage 31 PR-09: Nacos 注册中心 + 配置中心
Nacos:
  # Enabled: 省略 → Config default=true
  Addr:      ${NACOS_ADDR}
  Namespace: ${NACOS_NAMESPACE}
  GroupName: DEFAULT_GROUP
  # HotReload: 省略 → Config default=false
