syntax = "proto3";

package emotion_ai.v1;

option go_package = "github.com/emotion-echo/shared/pkg/emotionquery";

// EmotionQueryService 是 ai-svc 暴露给其他内部服务的查询接口（Stage 19）
//
// 之前只能通过 HTTP 调（ai-svc Gin server :8891）
// 现在多一个 gRPC 接口（ai-svc gRPC server :8892）
// 两种协议同时存在，前端继续用 HTTP，内部 svc-to-svc 用 gRPC
//
// Stage 34: 新增 GetFusedEmotion（多模态融合产物查询）
// Stage 36-A3: 新增 UpsertNeutralEmotion（chat-svc 同步 fallback 写入中性占位情绪）
service EmotionQueryService {
  // GetEmotionByMessage 根据 message_id 查情绪
  rpc GetEmotionByMessage (GetEmotionByMessageRequest) returns (Emotion);
  // GetEmotionByConversation 根据 conversation_id 查情绪列表
  rpc GetEmotionByConversation (GetEmotionByConversationRequest) returns (EmotionList);
  // GetFusedEmotion 根据 message_id 查多模态融合产物（Stage 34）
  rpc GetFusedEmotion (GetFusedEmotionRequest) returns (FusedEmotion);
  // UpsertNeutralEmotion 写入一条中性情绪占位（Stage 36-A3 / G4）
  //
  // 设计动机：Kafka 关闭时（KAFKA_ENABLED=false / dev 模式），chat-svc 发消息后
  // 不会经过 Kafka → ai-svc 永远不会写入 emotion_analysis 行，导致前端"情绪分析"
  // 功能在 dev 模式下完全无数据。本 RPC 让 chat-svc 在 send message 成功后
  // 同步调用 ai-svc，ai-svc 写入中性占位情绪（primary_emotion="neutral",
  // sentiment_score=0, confidence=0, model="sync-fallback"）。
  //
  // 幂等：使用 event_id 作为唯一键（DB UNIQUE 约束）。chat-svc 传其 outbox
  // event UUID；重复调用返回 OK 不重复落库（on conflict do nothing）。
  //
  // 错误语义：
  //   - message_id<=0 / user_id<=0 → InvalidArgument
  //   - 写入失败 → Internal
  //   - 成功 → 返回写入（或已存在）的 emotion_analysis 行 id
  rpc UpsertNeutralEmotion (UpsertNeutralEmotionRequest) returns (UpsertNeutralEmotionResponse);

  // MultiModalAnalyze 多模态情绪/语音/图像分析（Sprint F2 2026-09-11）
  //
  // 与 HTTP `POST /api/v1/multimodal/analyze` 语义对齐（multipart/form-data 转 bytes）。
  // 内部 svc-to-svc（BFF → ai-svc）走 gRPC；外部前端继续走 HTTP。
  //
  // 错误语义：
  //   - kind 非法 / file 缺失（kind!=text） → InvalidArgument
  //   - 上游 FER/SenseVoice/XTTS 不可用 → Unavailable（与 HTTP 503 对齐）
  //   - 其他 → Internal
  rpc MultiModalAnalyze (MultiModalAnalyzeRequest) returns (MultiModalAnalyzeResponse);

  // SynthesizeSpeech TTS 语音合成（Sprint F2 2026-09-11）
  //
  // 与 HTTP `POST /api/v1/tts/synthesize` 语义对齐。
  // 错误语义：XTTS 未配置 / 上游不可用 → Unavailable；其他 → Internal。
  rpc SynthesizeSpeech (SynthesizeSpeechRequest) returns (SynthesizeSpeechResponse);

  // AIHealth AI 服务集群健康探针（Sprint F2 2026-09-11）
  //
  // 与 HTTP `GET /api/v1/ai/health` 语义对齐。返回 FER/SenseVoice/XTTS
  // 各自 enabled/healthy 状态 + all_healthy 总标志。
  rpc AIHealth (AIHealthRequest) returns (AIHealthResponse);
}

// Emotion 单条消息的情绪数据
message Emotion {
  int64  id              = 1;
  int64  message_id      = 2;
  int64  conversation_id = 3;
  string primary_emotion = 4;  // happy/sad/anxious/angry/calm...
  double sentiment_score = 5;  // -1.0 ~ 1.0
  double confidence      = 6;
  string model           = 7;
  int64  created_at_ms   = 8;  // 毫秒时间戳
}

// GetEmotionByMessage 请求
message GetEmotionByMessageRequest {
  int64 message_id = 1;
}

// GetEmotionByConversation 请求
message GetEmotionByConversationRequest {
  int64 conversation_id = 1;
  int32 limit           = 2;  // 可选，默认 50
}

// EmotionList 多条情绪
message EmotionList {
  repeated Emotion items = 1;
  int32           total = 2;
}

// FusedEmotion 多模态融合产物（Stage 34）
//
// 对应 emotion_echo_ai.fused_emotions 表。
// primary_emotion / sentiment_score / confidence 来自融合结果；
// modality_contrib 是 JSON 字符串（key=text/voice/face，value=贡献度）；
// available_modalities 是 JSON 字符串数组；
// reasoning 是 LLM 输出（走 late_fusion_weighted 时为空）。
message FusedEmotion {
  int64    message_id            = 1;
  int64    user_id               = 2;
  int64    conversation_id       = 3;
  string   primary_emotion       = 4;
  double   sentiment_score       = 5;
  double   confidence            = 6;
  string   modality_contrib      = 7;  // JSON 字符串
  string   reasoning             = 8;  // 可空
  string   fusion_method         = 9;  // "llm" | "late_fusion_weighted"
  string   available_modalities  = 10; // JSON 字符串数组
  int64    created_at_ms         = 11;
}

// GetFusedEmotion 请求
message GetFusedEmotionRequest {
  int64 message_id = 1;
}

// UpsertNeutralEmotion 请求（Stage 36-A3）
//
// chat-svc 在 send message 成功后调用；ai-svc 写入一条中性占位
// emotion_analysis 行（event_id 由 chat-svc 用其 outbox UUID 填入，保证幂等）。
message UpsertNeutralEmotionRequest {
  int64  message_id      = 1;  // 必填
  int64  user_id         = 2;  // 必填
  int64  conversation_id = 3;  // 必填
  string event_id        = 4;  // 必填，chat-svc 的 outbox event UUID；空 = 不去重（不推荐）
}

// UpsertNeutralEmotion 响应
//
// 返回写入（或已存在）的 emotion_analysis 行 id，调用方可用于后续
// 关联 / 展示。当前实现 id 由 ai-svc DB 自增；event_id 命中时 id 是已有行的 id。
message UpsertNeutralEmotionResponse {
  int64 emotion_analysis_id = 1;  // emotion_echo_ai.emotion_analysis.id
  bool  was_inserted        = 2;  // true=新建，false=event_id 已存在跳过
}

// =====================================================
// Sprint F2（2026-09-11）：3 业务 RPC + 6 message
// =====================================================

// MultiModalAnalyzeRequest 多模态分析请求
//
// kind: "image" | "audio" | "text"
// file_bytes: 当 kind != text 时必填
// persist: 是否写库（Stage 34）
// upload_id / message_id / user_id / conversation_id: persist=true 时用
// transcript / duration_ms / language: voice 附加字段
message MultiModalAnalyzeRequest {
  string kind            = 1;
  string filename        = 2;  // 可选
  bytes  file_bytes      = 3;  // kind != text 时必填
  string text_content    = 4;  // 文本（kind=text 时或辅助）
  bool   persist         = 5;
  string upload_id       = 6;
  int64  message_id      = 7;
  int64  user_id         = 8;
  int64  conversation_id = 9;
  string transcript      = 10;
  int32  duration_ms     = 11;
  string language        = 12;
}

// MultiModalAnalyzeResponse 多模态分析响应
message MultiModalAnalyzeResponse {
  string kind                = 1;
  string emotion             = 2;
  double confidence          = 3;
  double sentiment_score     = 4;
  string model               = 5;
  string transcript          = 6;  // 可空
  map<string, double> all_scores = 7;  // 可空
}

// SynthesizeSpeechRequest TTS 请求
message SynthesizeSpeechRequest {
  string text     = 1;
  string language = 2;  // e.g. "zh-cn"
  double speed    = 3;
}

// SynthesizeSpeechResponse TTS 响应
message SynthesizeSpeechResponse {
  string audio       = 1;  // base64-encoded WAV
  int32  sample_rate = 2;
  string mime        = 3;
  int32  bytes       = 4;
  string text        = 5;
  string language    = 6;
}

// AIHealthRequest 健康探针请求（空消息体）
message AIHealthRequest {
}

// AIHealthEntry 单个 AI 服务健康状态
message AIHealthEntry {
  bool   enabled = 1;
  bool   healthy = 2;
  string error   = 3;  // 可空
}

// AIHealthResponse 健康探针响应
message AIHealthResponse {
  int64          time_ms    = 1;
  bool           all_healthy = 2;
  AIHealthEntry  fer        = 3;  // 可空
  AIHealthEntry  sensevoice = 4;  // 可空
  AIHealthEntry  xtts       = 5;  // 可空
}
