// proto/user.proto
//
// Stage 62 PR-3.1: user-svc 暴露给 BFF 的 gRPC 接口（gRPC 渐进迁移 Phase 2）
// Sprint E (2026-09-11) 增补: Login / Register RPC
//
// 背景（docs/plans/grpc-inter-service-migration.md §二 决策 A）：
//   Stage 58 PR-GRPC-1~6 已落地 chat-svc → BFF gRPC 化（CHAT_TRANSPORT=grpc 默认）。
//   Sprint E 推广到 user-svc auth：Login / Register 走 gRPC（accessToken 仍由 BFF jwt.Sign 签发）。
//
// 端点 1:1 对齐（emotion-echo-web-bff/internal/downstream/user.go）：
//   GET    /api/v1/users/me       → GetMe
//   PATCH  /api/v1/users/me       → UpdateProfile
//   GET    /api/v1/users/:id      → GetUserById
//   POST   /api/v1/auth/login     → Login       (Sprint E 新增)
//   POST   /api/v1/auth/register  → Register    (Sprint E 新增)
//
// CL-06（2026-10-17，用户自定义 Agent·多角色）增补: 角色档案 3 个 RPC
//   （BFF 侧端点随 CL-06 Phase 4 落地）
//   GET    /api/v1/agents         → ListAgentProfiles（**含 get-or-create**：首次读会物化默认「小E」）
//   POST   /api/v1/agents         → UpsertAgentProfile（id=0 新建 / >0 更新）
//   DELETE /api/v1/agents/:id     → DeleteAgentProfile（软删除，幂等）
//
// 与 chat.proto 区别：
//   - package: emotion_user.v1（user-svc）
//   - go_package: emotionuser
//   - 仅 unary（user-svc 当前无 stream 需求）
//
// 关联：
//   - docs/plans/stage-62-cleanup-and-grpc-plan.md §二.3 PR-3
//   - emotion-echo-web-bff/internal/downstream/user.go（HTTP 客户端，作为 gRPC fallback）
//   - emotion-echo-user-svc/internal/handler/{user_handler,auth_handler}.go（HTTP handler，将被 gRPC server 复用）

syntax = "proto3";

package emotion_user.v1;

option go_package = "github.com/emotion-echo/shared/pkg/emotionuser";

// UserService user-svc 暴露给 BFF 的接口
//
// user-svc 同时跑 HTTP (:8888) + gRPC (:8887)。前端继续走 HTTP（APISIX 网关），
// 内部 BFF 走 gRPC。
service UserService {
  // GetMe 获取当前用户信息
  //
  // 鉴权：user_id 通过 metadata "x-user-id" 传（与 emotion_query.proto / emotion_chat.proto 一致）
  rpc GetMe (GetMeRequest) returns (UserInfo);

  // UpdateProfile 修改当前用户资料
  //
  // 全 optional 指针：nil = 不修改（与 HTTP PATCH 语义一致）
  rpc UpdateProfile (UpdateProfileRequest) returns (UserInfo);

  // GetUserById 根据 user_id 查询用户（公开信息）
  rpc GetUserById (GetUserByIdRequest) returns (UserInfo);

  // Login 用 username + password 登录，返 UserInfo
  //
  // 注意：accessToken 不在此 RPC 返回——由 BFF 收到 UserInfo 后用 jwt.Manager 自行签发。
  // 这样 gRPC 契约只关心业务语义（用户身份），鉴权令牌签发仍归 BFF 单点管控。
  //
  // 鉴权：匿名调用（无 metadata x-user-id）。userid 拦截器需在 server 端跳过此 RPC。
  rpc Login (LoginRequest) returns (LoginResponse);

  // Register 新建用户（username 唯一），返 UserInfo
  //
  // 鉴权：匿名调用（同 Login）。
  rpc Register (RegisterRequest) returns (RegisterResponse);

  // ResetPassword 用 username + verificationCode + newPassword 重置密码，返 UserInfo
  //
  // 鉴权：匿名调用（同 Login/Register）。userid 拦截器跳过。
  // 当前 Sprint 1 PR-4c-4 后的行为：verificationCode 由 BFF 校验后转发 user-svc，
  // 这里是 dev mode（user-svc 自己校验 verificationCode 字段）；prod 接入 SMS/Email 后由 BFF 校验。
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);

  // ── CL-02 清除（2026-10-14 用户裁定 D3/D4）──────────────────────────────
  // 本服务曾声明 Logout 与 VerifySecurityAnswer 两个 RPC，已**删除**（连带其
  // LogoutRequest/LogoutResponse/VerifySecurityAnswerRequest/VerifySecurityAnswerResponse 消息）：
  //   · Logout（D3）：服务端无副作用（只返 success=true）、全仓零调用方；「实现真登出」需
  //     token 黑名单/主动吊销，而 ADR-2026-10-jwt-key-rotation-dual-key 明确「不做」
  //     （D-46 亦把服务端吊销表判为「量大不成比」）⇒ 按文档不接真，直接清除。
  //     登出语义仍由 BFF 清 cookie 承担。
  //   · VerifySecurityAnswer（D4）：与下方 VerifySecurityAnswerByUsername **族内冗余**
  //     （按 user_id 版在找回密码流程里用不上——发起时用户尚未登录），零 handler 调用。
  // 状态由 scripts/rpc_status.tsv 管理（status=deleted），守卫 scripts/check_rpc_status.sh
  // 断言「deleted 的 RPC 不得残留于 proto」。如需恢复，请先立 ADR 说明需求与吊销方案。
  // ─────────────────────────────────────────────────────────────────────

  // VerifySecurityAnswerByUsername 按用户名验证密保答案（R-01 #2 真修通）
  //
  // 为什么需要：找回密码发起时用户尚未登录，前端只有用户名、没有 user_id，
  // 故只能按用户名校验。HTTP transport 侧的
  // POST /api/v1/users/verify-security-answer 早已支持按用户名校验，
  // 但 gRPC 侧此前是"未实现"桩，而 BFF 默认走 gRPC
  // ⇒ 找回密码在 dev/默认配置下恒 401（端点可达但功能不通）。
  // 本 RPC 让两种 transport 行为对齐。
  //
  // 鉴权：匿名调用（同 Login/Register）。userid 拦截器跳过。
  rpc VerifySecurityAnswerByUsername (VerifySecurityAnswerByUsernameRequest) returns (VerifySecurityAnswerByUsernameResponse);

  // GetSecurityQuestionsByUsername 按用户名获取密保问题列表（E2E-07）
  //
  // 返回用户的密保问题（不含答案），用于找回密码流程展示问题。
  // 防枚举：用户不存在时返回空列表（而非错误）。
  //
  // 鉴权：匿名调用（同 Login/Register）。userid 拦截器跳过。
  rpc GetSecurityQuestionsByUsername (GetSecurityQuestionsByUsernameRequest) returns (GetSecurityQuestionsByUsernameResponse);

  // ===== CL-06（用户自定义 Agent·多角色）：角色档案 =====

  // ListAgentProfiles 列出当前用户的角色档案（每户 ≤5，不含已软删除）
  //
  // 鉴权：user_id 通过 metadata "x-user-id" 传（与 GetMe 一致）。
  // **副作用（有意）**：用户**从未建过角色**时，按需物化一条默认「小E」再返回
  //   （get-or-create；默认角色可改可删 —— 见 docs/closure-roadmap/decisions.md CL-D-21）。
  rpc ListAgentProfiles (ListAgentProfilesRequest) returns (ListAgentProfilesResponse);

  // UpsertAgentProfile 新建（id=0）或更新（id>0）角色档案
  //
  // 服务端强制（客户端不可绕过）：
  //   - 每户活跃角色 ≤5（超出 ⇒ InvalidArgument）；
  //   - 字段上限 name≤20 / persona≤500 / tone≤100 / boundaries≤5 条且每条≤50；
  //   - voice 必须在 8 个预置音色白名单内；
  //   - 更新时角色必须属于当前用户（否则 NotFound，防越权改他人角色）。
  rpc UpsertAgentProfile (UpsertAgentProfileRequest) returns (AgentProfile);

  // DeleteAgentProfile 软删除角色档案（幂等；重复删除不报错）
  //
  // 删除后该角色不再出现在列表；已被历史消息引用的 agent_id 不受影响（消息侧是快照语义）。
  rpc DeleteAgentProfile (DeleteAgentProfileRequest) returns (DeleteAgentProfileResponse);
}

// ============== Requests / Responses ==============

// GetMeRequest 获取当前用户请求
message GetMeRequest {
  // 空消息体（鉴权信息走 metadata）
}

// UpdateProfileRequest 修改用户资料请求
//
// 全 optional 字段（用 wrapper 类型）：nil = 不修改该字段
message UpdateProfileRequest {
  optional string nickname = 1;
  optional string avatar_url = 2;
  optional int32 gender = 3;          // 0=未设置 1=男 2=女
  // E2E-06: phone/email 已从 users 表删除（死字段，业务不使用）
  reserved 4, 5;
  // E2E-12: 用户个性化配置（fontSize/theme 等），JSON 字符串
  optional string config = 6;
}

// GetUserByIdRequest 查询用户请求
message GetUserByIdRequest {
  int64 user_id = 1;
}

// LoginRequest 登录请求
message LoginRequest {
  string username = 1;
  string password = 2;
}

// LoginResponse 登录响应（仅返 user info，accessToken 由 BFF 签发）
message LoginResponse {
  UserInfo user = 1;
}

// SecurityQuestion 密保问题（E2E-06，供 D-01=C 找回密码）
message SecurityQuestion {
  string question = 1;
  string answer = 2;
}

// RegisterRequest 注册请求
message RegisterRequest {
  string username = 1;
  string password = 2;
  // verificationCode 可选：dev mode 不强制验证码（生产由 BFF 校验）
  optional string verification_code = 3;
  // E2E-06: phone 已从 users 表删除（死字段，业务不使用）
  reserved 4;
  optional string nickname = 5;
  // E2E-06: 密保问题（必填，1~2 个）
  repeated SecurityQuestion security_questions = 6;
}

// RegisterResponse 注册响应
message RegisterResponse {
  UserInfo user = 1;
}

// ResetPasswordRequest 重置密码请求
message ResetPasswordRequest {
  string username = 1;
  string verification_code = 2;
  string new_password = 3;
}

// ResetPasswordResponse 重置密码响应
message ResetPasswordResponse {
  UserInfo user = 1;
}

// ── CL-02 清除（2026-10-14，用户裁定 D3/D4）：以下 4 个消息随其 RPC 一并删除 ──
//   LogoutRequest / LogoutResponse                    （D3，见 service 段说明）
//   VerifySecurityAnswerRequest / VerifySecurityAnswerResponse （D4，族内冗余）
// 如需恢复，请先立 ADR；消息名与字段号**不得**被无关新消息复用（避免线上旧客户端误解析）。

// VerifySecurityAnswerByUsernameRequest 按用户名验证密保答案请求（R-01 #2）
message VerifySecurityAnswerByUsernameRequest {
  string username = 1;
  int32 question_order = 2;  // 1 或 2
  string answer = 3;
}

// VerifySecurityAnswerByUsernameResponse 按用户名验证密保答案响应
//
// 用户不存在与答案错误返回同一种 gRPC 错误（Unauthenticated），
// 防用户名枚举；成功时 success=true。
message VerifySecurityAnswerByUsernameResponse {
  bool success = 1;
}

// SecurityQuestionInfo 返回给前端的密保问题信息（不含答案）
message SecurityQuestionInfo {
  int32 question_order = 1;
  string question = 2;
}

// GetSecurityQuestionsByUsernameRequest 获取密保问题请求
message GetSecurityQuestionsByUsernameRequest {
  string username = 1;
}

// GetSecurityQuestionsByUsernameResponse 获取密保问题响应
message GetSecurityQuestionsByUsernameResponse {
  repeated SecurityQuestionInfo questions = 1;
}

// UserInfo 用户信息视图
//
// 字段命名遵循 emotion_query.proto 已确立的 snake_case
message UserInfo {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string avatar_url = 4;
  int32 gender = 5;                   // 0=未设置 1=男 2=女
  // E2E-06: phone/email 已从 users 表删除（死字段，业务不使用）
  reserved 6, 7;
  int64 created_at = 8;               // unix seconds
  int64 updated_at = 9;
  // E2E-12: 用户个性化配置（fontSize/theme 等），JSON 字符串
  optional string config = 10;
}

// ============== CL-06 角色档案（用户自定义 Agent·多角色）==============

// AgentProfile 角色档案视图
//
// 上限口径见 UpsertAgentProfile：name≤20 / persona≤500 / tone≤100 /
// boundaries≤5 条且每条≤50 / voice ∈ 8 个预置音色。
message AgentProfile {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  string gender = 4;              // 展示用；不参与安全判定
  string persona = 5;             // 背景人设（核心字段）
  string tone = 6;                // 语气风格
  repeated string boundaries = 7; // 负向约束（"不要…"）
  string voice = 8;               // CosyVoice2 预置音色（带模型名前缀）
  bool is_default = 9;            // 默认「小E」
  string template_id = 10;        // 预设模板来源（可空）
  int64 created_at = 11;          // unix seconds
  int64 updated_at = 12;
}

// ListAgentProfilesRequest 列角色请求（鉴权走 metadata，无参数）
message ListAgentProfilesRequest {}

// ListAgentProfilesResponse 列角色响应
message ListAgentProfilesResponse {
  repeated AgentProfile items = 1;
  int32 total = 2;
}

// UpsertAgentProfileRequest 新建 / 更新角色请求
message UpsertAgentProfileRequest {
  // id = 0 ⇒ 新建；>0 ⇒ 更新（必须属于当前用户）
  int64 id = 1;
  string name = 2;
  string gender = 3;
  string persona = 4;
  string tone = 5;
  repeated string boundaries = 6;
  string voice = 7;
  bool is_default = 8;
  string template_id = 9;
}

// DeleteAgentProfileRequest 删除角色请求
message DeleteAgentProfileRequest {
  int64 id = 1;
}

// DeleteAgentProfileResponse 删除角色响应
message DeleteAgentProfileResponse {
  bool deleted = 1;
}
