Name: emotion-echo-user-svc
Host: 0.0.0.0
Port: 8888

# Stage 26-P:容器内服务发现(env 占位)
SkyWalking:
  OAPAddr:     ${SKYWALKING_OAP_ADDR:-emotion-echo-sw-oap:11800}
  ServiceName: emotion-echo-user-svc
  Enabled:     true

Postgres:
  DSN:          ${POSTGRES_DSN:-"host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_user"}
  MaxOpenConns: 10
  MaxIdleConns: 5

# Stage 31 PR-07: Nacos 注册中心 + 配置中心
# dev 默认开启（依赖 compose depends_on: nacos: service_healthy）；
# dev 关闭热重载避免日志噪音；prod 启用。
#
# Stage 33 部署修复：go-zero conf 库对 env 占位符 ${NACOS_ENABLED:-true} 做替换
# 后仍是 string，无法转 bool（type mismatch）。改用 NacosEnabled/NacosHotReload
# 直接读 env，不走 yaml 占位符。
Nacos:
  Enabled:   true
  Addr:      emotion-echo-nacos:8848
  Namespace: emotion-echo-dev
  GroupName: DEFAULT_GROUP
  HotReload: false
