Name: emotion-echo-chat-svc
Host: 0.0.0.0
Port: 8890

# Stage 36-A1.2:容器内服务发现
# 外部依赖的 string 地址通过 env 注入 compose environment (由 main.go applyEnvOverrides 完成)
# list 字段 (Kafka.Brokers) 改用 BrokersCSV (string),同 ai-svc 范式
#
# 历史（Stage 26-P）使用 ${VAR:-default} 占位符，但 go-zero conf 不解析该语法（Stage 22-B
# 已确认），字面 ${...} 会被当成 host 字面值传给 go2sky / sarama / postgres driver，
# 导致 "too many colons in address" / "missing port in address" 错误循环。
# 现改为字面默认值，runtime env 覆盖由 main.go applyEnvOverrides 负责。

SkyWalking:
  OAPAddr:     localhost:11800
  ServiceName: emotion-echo-chat-svc
  # Enabled: 省略 → Config struct tag default=false；env SKYWALKING_ENABLED 由 main.go 注入

Postgres:
  DSN:          "host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_chat"
  MaxOpenConns: 10
  MaxIdleConns: 5

Kafka:
  BrokersCSV: emotion-echo-kafka:9092
  GroupID:    chat-svc
  # Enabled: 省略 → Config struct tag default=true（outbox relay 依赖 Kafka）

# Stage 31 PR-08: Nacos 注册中心 + 配置中心
# Stage 36-A1.2：与 user-svc / ai-svc 一致——yaml 不再含 ${NACOS_*} 占位符，
# env 覆盖由 main.go applyEnvOverrides 完成。
Nacos:
  # Enabled: 省略 → Config struct tag default=true
  Addr:      emotion-echo-nacos:8848
  Namespace: emotion-echo-dev
  GroupName: DEFAULT_GROUP
  # HotReload: 省略 → Config struct tag default=false

# Stage 36-A3.2: ai-svc gRPC 客户端配置
# dev fallback（KAFKA_ENABLED=false）时，chat-svc 用此地址 dial ai-svc 同步写中性情绪占位。
# 容器内默认 DNS；本地调试改成 localhost:8892。
AIService:
  GRPCAddr: emotion-echo-ai-svc:8892

