# Round 2.3 §PR-1: DLQ 投递失败告警
#
# 指标:
#   emotion_echo_dlq_publish_total{result="success|failure"} (ai-svc /metrics)
#   emotion_echo_analytics_dlq_publish_total{result="success|failure"} (analytics-svc /metrics)
#
# 含义（kafka-pipeline-pending-decisions.md §P1-14）：
#   ai-svc / analytics-svc consumer 调 DLQ.Publish 发到 chat-events-dlq 时失败
#   （broker 不可达 / sarama 超时）。此时业务消息已 MarkMessage 也无法挽回——
#   属于"业务 + DLQ 双失败"黑洞，failure rate 非 0 时值班需立即排查。
#
# 阈值: rate over 5m > 0.1（即 5 分钟内每分钟至少 0.1 次失败）→ severity=critical
#
# 注意: 与 outbox-dead.yml 不同，DLQ 失败不意味"事件丢失"（sarama 已 retry + 业务 MarkMessage），
# 但意味"毒消息 + 失败原因"都进不了 DLQ topic —— 排查时无法用 DLQ replay。
#
# 处置:
#   1. psql 查 emotion_echo_chat.outbox_events WHERE status='dead' (ai-svc 失败的原始事件)
#   2. docker logs ai-svc | grep "DLQ publish failed" 找 sarama 错误
#   3. 修 broker / sarama config 后手工 replay (调 outbox_events WHERE event_id IN (...) UPDATE status='pending')

groups:
  - name: kafka-dlq
    interval: 30s
    rules:
      - alert: AIDLQPublishFailure
        expr: rate(emotion_echo_dlq_publish_total{result="failure"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          component: ai-svc
        annotations:
          summary: "ai-svc DLQ publish failure rate > 0.1/s over 5m"
          description: |
            ai-svc DLQ.Publish 失败率 = {{ $value }}/s。
            业务消息 + DLQ 双失败。**CL-D-17=A 起语义已变**：DLQ 投递失败时**不再 MarkMessage**，
            消息留待重投（Kafka 恢复后自然重试）—— 不再是"已 Mark 无法挽回"。
            查 ai-svc 日志 "consumer DLQ publish failed (will NOT mark; message stays for redelivery)" 找 broker 错误。

      - alert: AnalyticsDLQPublishFailure
        expr: rate(emotion_echo_analytics_dlq_publish_total{result="failure"}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          component: analytics-svc
        annotations:
          summary: "analytics-svc DLQ publish failure rate > 0.1/s over 5m"
          description: |
            analytics-svc DLQ.Publish 失败率 = {{ $value }}/s。
            user_behavior_events 落库失败的毒消息 + DLQ 双失败（同上：CL-D-17=A 起**不 Mark**，消息留待重投）。
            查 analytics-svc 日志 "DLQ publish failed (will NOT mark; message stays for redelivery)" 找 broker 错误。

      # CL-03 Phase 4a: 堆积告警 —— 四问题之四「堆积不告警」
      #
      # DLQ 无常驻 consumer（设计上人工回放）⇒ 任何**进入** DLQ 的消息都处于堆积态，
      # 入口速率即堆积增长速率。故用 topic offset 的增长表达"有新消息进来"：
      #   - 不能用 kafka_consumergroup_lag：DLQ 无消费组 ⇒ 该 series 恒不存在
      #     （这正是 E2E-F-150「面板永远 No data」的根因，别重犯）
      #   - 不用 offset 绝对值：current_offset 是"累计写入"而非"当前深度"
      #
      # ⚠️ 已知限制（如实登记，勿当已闭合）：本告警表达"有新消息进入 DLQ"，
      #    **不等于**"当前还有多少条未处理"。真正的深度需要
      #    kafka_topic_partition_oldest_offset（kafka-exporter 标准指标之一，
      #    但本栈此前未在任何规则/面板中使用 ⇒ 可采性未验证，需起栈实测后再定）。
      - alert: DLQMessagesAccumulating
        expr: sum(increase(kafka_topic_partition_current_offset{topic="chat-events-dlq"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "chat-events-dlq 近 10 分钟有新消息进入（DLQ 无消费者 ⇒ 进入即堆积）"
          description: |
            近 10 分钟 chat-events-dlq 写入增长 = {{ $value }} 条。
            DLQ 无常驻 consumer（人工回放设计）⇒ 进入即堆积，需查看并择机回放。
            处置：
              1. 看板 kafka-consumer-lag → "DLQ" 面板（同源于本 expr）
              2. 找失败原因：ai-svc / analytics-svc 日志 grep "DLQ publish failed"
              3. 回放：go run ./scripts/replay_dlq -brokers <addr> -limit 0
                 （幂等靠消费端 ON CONFLICT(event_id, occurred_at) DO NOTHING）