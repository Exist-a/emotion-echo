# PR-OBS-4: dev compose Prometheus scrape config
#
# 镜像版本: prom/prometheus:v2.51.2 (与 charts/emotion-echo/charts/prometheus/Chart.yaml 同步)
# 启动方式: COMPOSE_PROFILES=obs docker compose -f deploy/docker-compose.infra.yml -f deploy/docker-compose.apps.yml up -d
#
# scrape 策略:
#   - 6 业务 svc (user/chat/assessment/analytics/ai-svc/web-bff) 通过 :8888-:8904 的 /metrics 端点
#   - APISIX 通过 :9091 /apisix/prometheus/metrics
#   - SkyWalking OAP 通过 :1234 (需 OAP 启用 SW_TELEMETRY=true,见 docker-compose.infra.yml sw-oap env)
#   - prometheus 自监控 :9090
#
# 注意: 静态 target 而非 kubernetes-pods SD,因 dev compose 无 Pod API。
#       容器 DNS 用 compose 网络服务名 (emotion-echo-user-svc 等),与 k8s 路径 scrape job 等价。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "emotion-echo-dev"

scrape_configs:
  # === 6 业务 svc /metrics 端点 ===
  - job_name: "emotion-echo-services"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "emotion-echo-user-svc:8888"
          - "emotion-echo-chat-svc:8890"
          - "emotion-echo-assessment-svc:8889"
          - "emotion-echo-analytics-svc:8893"
          - "emotion-echo-ai-svc:8891"
          - "emotion-echo-web-bff:8894"
          # E2E-22 (2026-09-29): llm-service 暴露 /metrics (emotion-llm-service/main.py:215)
          # 但此前无 target ⇒ dev 采不到, 而 k8s chart 却带 prometheus.io/scrape
          # annotation ⇒ 双栈不一致; smoke 的 EXPECTED_TARGETS 同样漏了它,
          # 结构上不可能发现该缺口。端口未映射宿主(仅 expose), 但同在 app-network,
          # Prometheus 容器网络内可达。
          - "emotion-llm-service:8000"
        labels:
          monitor: "emotion-echo-dev"

  # === Alertmanager 自身 (E2E-22) ===
  # 此前 5 个 job 中没有 alertmanager —— "收告警的东西自己无指标", 它挂掉时
  # 无人知道。E2E-22 实测: 2026-09-29 prometheus 与 alertmanager 同刻 Exited(255),
  # 而正因为 Prometheus 也死了, 规则不评估 ⇒ 零告警。
  - job_name: "alertmanager"
    static_configs:
      - targets: ["emotion-echo-alertmanager:9093"]
        labels:
          component: "alertmanager"

  # === APISIX prometheus plugin ===
  - job_name: "apisix"
    metrics_path: "/apisix/prometheus/metrics"
    static_configs:
      - targets: ["emotion-echo-apisix:9091"]
        labels:
          component: "apisix"

  # === SkyWalking OAP self-metrics ===
  # O-1 启用: deploy/docker-compose.infra.yml sw-oap env 已加 SW_TELEMETRY=prometheus,
  # OAP 9.7 监听 :1234 输出 self-metrics (queue/grpc/jvm-h/metrics 维度)
  # 关闭路径: 把 compose env SW_TELEMETRY 删掉或设 false 即可。
  - job_name: "skywalking-oap"
    static_configs:
      - targets: ["emotion-echo-sw-oap:1234"]
        labels:
          component: "skywalking"

  # === prometheus 自监控 ===
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: "prometheus"

  # === PR-OBS-7: Kafka exporter (consumer lag) ===
  # danielqsj/kafka-exporter 自动发现 consumer group,暴露 kafka_consumergroup_lag series
  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["emotion-echo-kafka-exporter:9308"]
        labels:
          component: "kafka"

# === PR-OBS-7 + Round 2.3: alert rules (kafka-lag + outbox-dead + kafka-dlq) ===
rule_files:
  - "/etc/prometheus/rules/*.yml"

# === Stage 86 (§3.6): 告警推送 alertmanager ===
# outbox dead 行 (OutboxEventsDead, critical) 与 kafka lag (warning) 经此路由进
# alertmanager (dev 只做聚合去重 + :9093 Web UI 展示, 见 deploy/alertmanager/alertmanager.yml)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["emotion-echo-alertmanager:9093"]
