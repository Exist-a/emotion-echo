      # dev 起栈自愈（CL-D-38，2026-10-18 用户裁定；原编 CL-D-35，与 CL-08 规划撞号故让号）：依赖未就绪 ⇒ **退出启动**，
      # 交给本服务既有的 `restart: on-failure` 重试到就绪。取代"重试耗尽后降级继续跑、
      # 且永不恢复"（CL-F-16 的 daemon 重启路径：Docker Desktop 整栈重启实测会犯 ——
      # 服务先于 Postgres 就绪启动 ⇒ /health/ready 恒 dbOk:false，须人工 restart）。
      # 机制在 shared/pkg/bootstrap 早已存在，但此前**从未下发给任何容器**。
      # 先例 = docker-compose.clp2-strict.yml（CL-02 实验配置，只覆盖 user-svc）。
      STARTUP_STRICT: "true"
      STARTUP_STRICT_DEPS: "postgres"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:3000}"
