# =====================================================
#  Emotion-Echo dev 环境 override（ADR-20 C 方案）
#
#  用途：本地开发环境的 dev 假设集中地，与 apps.yml 基线解耦。
#  启动：docker compose -f docker-compose.infra.yml \
#                    -f docker-compose.apps.yml \
#                    -f compose.dev.yml up -d
#
#  设计原则：
#    - 只覆盖既有 services（不引入新服务）
#    - 覆盖项对应 ADR-20 §三关键差异清单中"dev vs prod"列
#    - 所有 prod 不应出现的 dev 假设（端口暴露、DEV_RETURN_CODE 等）集中在此
#
#  当前覆盖项（Stage 58 PR-ENV-1）：
#    1. BFF 8894:8894 端口映射（dev 调试便利；prod 应仅 APISIX 可达）
#    2. BFF_DEV_RETURN_CODE=1（dev 回显验证码；prod 必须 0）
#    3. BFF_TRUST_APISIX=true（dev 直连 BFF 调试；prod 由 APISIX 强制注入 X-User-Id）
#    4. CORS_ALLOW_ORIGINS=http://localhost:3000（Nuxt dev server）
#    5. emotion-echo-web NUXT_PUBLIC_API_BASE_URL=http://localhost:19080（APISIX 宿主映射）
#    6. emotion-echo-web 3000:3000 端口映射（dev 看前端；prod 反代或不放宿主）
#
#  关联文档：docs/architecture/adr/adr-2026-09-env-profile-strategy.md
# =====================================================

services:

  # BFF 覆盖：dev 调试便利（验证码回显 + 信任 APISIX 注入的身份）
  emotion-echo-web-bff:
    environment:
      # dev 起栈自愈（CL-D-38，2026-10-18 用户裁定；原编 CL-D-35，与 CL-08 规划撞号故让号）：依赖未就绪 ⇒ **退出启动**，
      # 交给本服务既有的 `restart: on-failure` 重试到就绪。取代"重试耗尽后降级继续跑、
      # 且永不恢复"（CL-F-16 的 daemon 重启路径：Docker Desktop 整栈重启实测会犯 ——
      # 服务先于 Postgres 就绪启动 ⇒ /health/ready 恒 dbOk:false，须人工 restart）。
      # 机制在 shared/pkg/bootstrap 早已存在，但此前**从未下发给任何容器**。
      # 先例 = docker-compose.clp2-strict.yml（CL-02 实验配置，只覆盖 user-svc）。
      STARTUP_STRICT: "true"
      STARTUP_STRICT_DEPS: "postgres"
      # prod 必须 0，dev 默认 1（验证码回显方便 forget-pwd e2e）
      BFF_DEV_RETURN_CODE: ${BFF_DEV_RETURN_CODE:-1}
      # dev 默认 true：BFF 只认 APISIX 注入的 X-User-Id（dev 也走 :19080 网关链路）
      BFF_TRUST_APISIX: ${BFF_TRUST_APISIX:-true}
      # dev Docker 网络 CIDR（TrustAPISIX=true 时必填，否则 BFF 启动即失败——D-47 ②）。
      # 该段**含 docker 网关**，故它只对"容器网内调用者"有意义：宿主到 BFF 的通路已在
      # D-47 ③ 收掉（apps.yml 已移除 8894 映射）⇒ 宿主无法再借网关 IP 落在白名单内伪造身份。
      BFF_APISIX_CIDRS: ${BFF_APISIX_CIDRS:-172.18.0.0/16}
      # dev 默认 DEBUG（看调试日志）；prod 设 INFO（apps.yml 默认值）
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    # E2E-29 D-47 ③：dev 也不再发布 8894 —— 直连面即"伪造 X-User-Id 绕过网关"的入口
    # （E2E-F-202）。需要直连请用 `docker exec emotion-echo-web-bff ...`，或经 :19080。

  # Web 覆盖：dev 浏览器访问 + API base 指向宿主 localhost:19080
  emotion-echo-web:
    environment:
      # SPA 在浏览器执行，必须用宿主可达地址（19080 是 APISIX 宿主映射）
      NUXT_PUBLIC_API_BASE_URL: http://localhost:19080/api/v1
    ports:
      # dev 看前端 UI；prod 反代到域名或不暴露宿主页
      - "3000:3000"

  # 业务 svc CORS（dev 默认允许 Nuxt 本地端口；prod 用域名白名单）
  emotion-echo-chat-svc:
    environment:
      # dev 起栈自愈（CL-D-38，2026-10-18 用户裁定；原编 CL-D-35，与 CL-08 规划撞号故让号）：依赖未就绪 ⇒ **退出启动**，
      # 交给本服务既有的 `restart: on-failure` 重试到就绪。取代"重试耗尽后降级继续跑、
      # 且永不恢复"（CL-F-16 的 daemon 重启路径：Docker Desktop 整栈重启实测会犯 ——
      # 服务先于 Postgres 就绪启动 ⇒ /health/ready 恒 dbOk:false，须人工 restart）。
      # 机制在 shared/pkg/bootstrap 早已存在，但此前**从未下发给任何容器**。
      # 先例 = docker-compose.clp2-strict.yml（CL-02 实验配置，只覆盖 user-svc）。
      STARTUP_STRICT: "true"
      STARTUP_STRICT_DEPS: "postgres"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:3000}"
      # dev 默认 DEBUG（看调试日志）；prod 设 INFO（apps.yml 默认值）
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  emotion-echo-user-svc:
    environment:
      # dev 起栈自愈（CL-D-38，2026-10-18 用户裁定；原编 CL-D-35，与 CL-08 规划撞号故让号）：依赖未就绪 ⇒ **退出启动**，
      # 交给本服务既有的 `restart: on-failure` 重试到就绪。取代"重试耗尽后降级继续跑、
      # 且永不恢复"（CL-F-16 的 daemon 重启路径：Docker Desktop 整栈重启实测会犯 ——
      # 服务先于 Postgres 就绪启动 ⇒ /health/ready 恒 dbOk:false，须人工 restart）。
      # 机制在 shared/pkg/bootstrap 早已存在，但此前**从未下发给任何容器**。
      # 先例 = docker-compose.clp2-strict.yml（CL-02 实验配置，只覆盖 user-svc）。
      STARTUP_STRICT: "true"
      STARTUP_STRICT_DEPS: "postgres"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:3000}"
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  emotion-echo-ai-svc:
    environment:
      # dev 起栈自愈（CL-D-38，2026-10-18 用户裁定；原编 CL-D-35，与 CL-08 规划撞号故让号）：依赖未就绪 ⇒ **退出启动**，
      # 交给本服务既有的 `restart: on-failure` 重试到就绪。取代"重试耗尽后降级继续跑、
      # 且永不恢复"（CL-F-16 的 daemon 重启路径：Docker Desktop 整栈重启实测会犯 ——
