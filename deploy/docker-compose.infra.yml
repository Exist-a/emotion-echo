# =====================================================
#  Emotion-Echo 基础设施编排 (Stage 20-P0 + Stage 26-Q nginx 替代 APISIX)
#  启动：docker-compose -f deploy/docker-compose.infra.yml up -d
#  注意：业务应用在 deploy/docker-compose.apps.yml
# =====================================================

x-logging-env: &logging-env
  TZ: Asia/Shanghai

services:

  # =====================================================
  # postgres:15 (trust 模式 — 仅 dev)
  # =====================================================
  postgres:
    image: postgres:15-alpine
    container_name: emotion-echo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: emotion_echo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01-create-schemas.sql:/docker-entrypoint-initdb.d/01-create-schemas.sql:ro
      - ./db/02-create-tables-in-schemas.sql:/docker-entrypoint-initdb.d/02-create-tables-in-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =====================================================
  # redis:7
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: emotion-echo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network


  # =====================================================
  # kafka 3.7 (KRaft 模式, 无 Zookeeper)
  # =====================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: emotion-echo-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Stage 30: advertised 改为容器 DNS（业务 svc 容器内消费 kafka 需要）
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://emotion-echo-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_PROCESS_CONFIGS_TTL: 30000
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  # =====================================================
  # SkyWalking OAP (后端)
  # =====================================================
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: emotion-echo-sw-oap
    restart: unless-stopped
    environment:
      SW_STORAGE: h2
      SW_JDBC_URL: jdbc:h2:mem:skywalking-oap-db;DB_CLOSE_DELAY=-1
      TZ: Asia/Shanghai
    ports:
      - "11800:11800"
      - "12800:12800"
    networks:
      - app-network

  # =====================================================
  # SkyWalking UI (前端)
  # =====================================================
  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: emotion-echo-sw-ui
    restart: unless-stopped
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      TZ: Asia/Shanghai
    ports:
      - "18080:8080"
    networks:
      - app-network

# =====================================================
# 卷定义
# =====================================================
volumes:
  postgres_data:
  redis_data:
  kafka_data:

# =====================================================
# 网络定义 (Stage 26-Q:external, 与 apps.yml 共享 emotion-echo_app-network)
# =====================================================
networks:
  app-network:
    external: true
    name: emotion-echo_app-network
