# =====================================================
#  Emotion-Echo 基础设施编排 (Stage 20-P0 + Stage 26-Q nginx 替代 APISIX)
#  启动：docker-compose -f deploy/docker-compose.infra.yml up -d
#  注意：业务应用在 deploy/docker-compose.apps.yml
# =====================================================

x-logging-env: &logging-env
  TZ: Asia/Shanghai

services:

  # =====================================================
  # postgres:15 (trust 模式 — 仅 dev)
  # =====================================================
  postgres:
    image: postgres:15-alpine
    container_name: emotion-echo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: emotion_echo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01-create-schemas.sql:/docker-entrypoint-initdb.d/01-create-schemas.sql:ro
      - ./db/02-create-tables-in-schemas.sql:/docker-entrypoint-initdb.d/02-create-tables-in-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # =====================================================
  # redis:7
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: emotion-echo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network


  # =====================================================
  # kafka 3.7 (KRaft 模式, 无 Zookeeper)
  # =====================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: emotion-echo-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Stage 30: advertised 改为容器 DNS（业务 svc 容器内消费 kafka 需要）
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://emotion-echo-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_PROCESS_CONFIGS_TTL: 30000
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  # =====================================================
  # SkyWalking OAP (后端)
  # =====================================================
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: emotion-echo-sw-oap
    restart: unless-stopped
    environment:
      SW_STORAGE: h2
      SW_JDBC_URL: jdbc:h2:mem:skywalking-oap-db;DB_CLOSE_DELAY=-1
      TZ: Asia/Shanghai
    ports:
      - "11800:11800"
      - "12800:12800"
    networks:
      - app-network

# =====================================================
# SkyWalking UI (前端)
# =====================================================
  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: emotion-echo-sw-ui
    restart: unless-stopped
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
      TZ: Asia/Shanghai
    ports:
      - "18080:8080"
    networks:
      - app-network

  # =====================================================
  # Nacos 2.4.3 standalone（Stage 31 PR-11）
  # 注册中心 + 配置中心；dev 用内嵌 Derby，免外部依赖
  # 健康检查：/nacos/actuator/health → 200
  # 端口：8848 HTTP 控制台 + 9848/9849 gRPC（SDK 客户端）
  # =====================================================
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: emotion-echo-nacos
    restart: unless-stopped
    environment:
      <<: *logging-env
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
      # Stage 31 PR-11: dev 用 Derby 内嵌数据源；prod 切 MySQL（Stage 34+）
      SPRING_DATASOURCE_PLATFORM: derby
      # 鉴权：dev standalone 默认无账号；prod 通过 nacos.core.auth.enabled=true 开启
    ports:
      - "8848:8848"   # HTTP console + API
      - "9848:9848"   # gRPC client (SDK 客户端)
      - "9849:9849"   # gRPC server (cluster 内部)
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =====================================================
  # Etcd 3.5.13（Stage 32 PR-14）
  # APISIX config_provider 存储；单实例 emptyDir（dev），
  # 重启即清，由 deploy/apisix/seed.sh 重建（PR-15）。
  # =====================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: emotion-echo-etcd
    restart: unless-stopped
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=default=http://etcd:2380
      - --data-dir=/etcd-data
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  # =====================================================
  # APISIX 3.18 网关层（Stage 32 PR-14）
  # 独立网关层，与 web-bff 解耦（ADR 决策 11）。
  # TLS 默认关闭（APISIX 3.9 ssl_certificate_by_lua_block bug 未修）；
  # prod 前置 nginx:alpine 终结 TLS（profile: tls，本 PR 不实现）。
  # 端口：9080 HTTP data plane / 9180 Admin API / 9091 Prometheus exporter。
  # =====================================================
  apisix:
    image: apache/apisix:3.18.0-debian  # Stage 32
    container_name: emotion-echo-apisix
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    # Stage 32 PR-14 fix: 镜像 entrypoint 默认调 apisix init 同步 etcd 数据到本地 conf，
    # 然后调 init_etcd 健康检查（硬连 127.0.0.1）。但运行时 openresty 读 config.yaml 决定 etcd host，
    # 所以只要 config.yaml 正确就 OK。init_etcd 健康检查失败只是 warning（exit 1 来自脚本本身），
    # 我们用 || true 容忍这个已知 false-positive，然后继续启动 openresty。
    command:
      - "/bin/sh"
      - "-c"
      - "/usr/bin/apisix init 2>&1 || true; /usr/bin/apisix init_etcd 2>&1 || true; exec /usr/local/openresty/bin/openresty -p /usr/local/apisix -g 'daemon off;'"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml
    ports:
      # Stage 32 PR-14 fix: 9080 被 Windows host 上 NahimicService 占用，
      # curl localhost:9080 命中音频服务返回 301 about:blank（不是 APISIX）。
      # 改用 19080 作为 host 端口映射，容器内仍监听 9080。
      - "19080:9080"   # HTTP data plane (host 19080 → container 9080)
      - "9180:9180"    # Admin API（dev 暴露）
      - "9091:9091"    # Prometheus exporter
    networks:
      - app-network

  # =====================================================
  # APISIX Dashboard 3.18（Stage 32 PR-14）
  # 仅 dev 暴露；prod 通过 NetworkPolicy 限制 9000 端口
  # =====================================================
  apisix-dashboard:
    image: apache/apisix-dashboard:3.18.0-alpine
    container_name: emotion-echo-apisix-dashboard
    restart: unless-stopped
    depends_on:
      - apisix
    ports:
      - "9000:9000"   # Dashboard UI（admin/admin）
    networks:
      - app-network

# =====================================================
# 卷定义
# =====================================================
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  etcd-data:

# =====================================================
# 网络定义 (Stage 26-Q:external, 与 apps.yml 共享 emotion-echo_app-network)
# =====================================================
networks:
  app-network:
    external: true
    name: emotion-echo_app-network
