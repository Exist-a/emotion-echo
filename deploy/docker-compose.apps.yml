# =====================================================
#  Emotion-Echo 业务应用编排（Stage 20-P0：容器内服务发现）
#  用途：拉起 emotion-llm-service + emotion-echo-ai-svc + 可选 3 个 AI 模型服务
#  依赖：deploy/docker-compose.infra.yml 提供的 postgres/redis/kafka/skywalking
#
#  启动顺序：
#    1) docker-compose -f deploy/docker-compose.infra.yml up -d
#    2) docker-compose -f deploy/docker-compose.apps.yml up -d
#  或一键：
#    docker-compose -f deploy/docker-compose.infra.yml -f deploy/docker-compose.apps.yml up -d
#
#  启动 AI 模型服务（可选，资源紧张机器不启动）：
#    docker-compose -f deploy/docker-compose.apps.yml --profile ai up -d
#
#  Stage 20-P0-1：所有外部依赖用容器 DNS 名（emotion-echo-kafka / emotion-echo-postgres / emotion-echo-sw-oap / emotion-llm-service）
#  Stage 20-P0-4：资源限制 + 镜像 tag pinned
#  Stage 22-A  ：FER / SenseVoice / XTTS 三个 AI 模型服务（optional profile）
# =====================================================

x-logging-env: &logging-env
  TZ: Asia/Shanghai

services:

  # =====================================================
  # 数据库迁移（一次性 init 容器，2026-09-04 新增）
  #
  # 背景：13 个 */migrations/*.sql 此前没有任何自动执行机制，各文件注释只写
  # "应用方式：docker exec ... psql < 本文件"，靠人工且无处记录跑没跑过。
  # 实测后果：dev 库长期缺列/缺视图/缺角色——发消息 500
  # (column "client_msg_id" does not exist)，补一个后 smoke 从"看起来 10/10"
  # 暴露到 1/10（缺 analytics_reader 角色、缺 msg_summary_v 视图、缺 event_id 列）。
  #
  # 为什么不挂 initdb.d：Postgres 的 docker-entrypoint-initdb.d 只在**数据卷为空**
  # 时执行一次。挂进去对已有环境无效，之后新增的迁移对所有已存在环境也无效。
  # 它只能表达"初始状态"，表达不了"持续演进"。
  #
  # 本容器每次 up 都对齐一遍结构，跑完退出；5 个业务 svc 依赖它
  # service_completed_successfully，保证它们启动时表结构一定就位。
  # 全部迁移已幂等（analytics 004 的 CREATE ROLE 于本轮补了 DO $$ 守卫）。
  # 执行顺序 chat → ai → analytics 由 migrate.sh 定义，理由见该脚本注释。
  # =====================================================
  emotion-echo-db-migrate:
    image: postgres:15-alpine        # 与 infra 的 postgres 同版本，自带 psql
    container_name: emotion-echo-db-migrate
    restart: "no"                    # 一次性任务：跑完退出，失败不重启以免刷屏掩盖错误
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: emotion_echo
      MIGRATIONS_ROOT: /migrations
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro
      # 各服务的 migrations 目录按 <svc>/migrations 结构挂进去，
      # 与 migrate.sh 的 SERVICE_ORDER 拼路径方式一致
      - ../emotion-echo-chat-svc/migrations:/migrations/emotion-echo-chat-svc/migrations:ro
      - ../emotion-echo-ai-svc/migrations:/migrations/emotion-echo-ai-svc/migrations:ro
      - ../emotion-echo-analytics-svc/migrations:/migrations/emotion-echo-analytics-svc/migrations:ro
    entrypoint: ["sh", "/migrate.sh"]
    networks:
      - app-network

  # =====================================================
  # Stage 26-P · 4 Go 微服务 (chat/user/analytics/assessment)
  # 顺序: chat 优先(聊天是主入口),其他按字母
  # =====================================================

  emotion-echo-user-svc:
    build:
      context: ..
      dockerfile: emotion-echo-user-svc/Dockerfile
    image: emotion-echo/user-svc:v0.1.0
    container_name: emotion-echo-user-svc
    restart: unless-stopped
    environment:
      <<: *logging-env
      # Stage 31 PR-11: Nacos 注册中心 + 配置中心
      NACOS_ENABLED:   "true"
      NACOS_ADDR:      "emotion-echo-nacos:8848"
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-emotion-echo-dev}"
      NACOS_HOT_RELOAD: "false"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL:  ${LOG_LEVEL:-INFO}
      GIN_MODE: release
      # 容器 DNS 占位化(Stage 26-P · Commit P3 yaml env 化对应)
      POSTGRES_DSN:        "host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_user"
      SKYWALKING_OAP_ADDR: emotion-echo-sw-oap:11800
      SKYWALKING_ENABLED: "${SKYWALKING_ENABLED:-true}"
    # Stage 33 PR-20: 删除宿主端口映射（APISIX 转发即可；dev 调试走 APISIX :19080）
    # expose: 容器内可见（其他 svc 互联）
    expose:
      - "8888"
    volumes:
      - ../emotion-echo-user-svc/etc/user-api.yaml:/app/etc/user-api.yaml:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      postgres:
        condition: service_started
      # 2026-09-04: 表结构必须先就位，否则启动即写不存在的列（发消息 500）
      emotion-echo-db-migrate:
        condition: service_completed_successfully
      skywalking-oap:
        condition: service_started

      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:8888/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  emotion-echo-chat-svc:
    build:
      context: ..
      dockerfile: emotion-echo-chat-svc/Dockerfile
    image: emotion-echo/chat-svc:v0.1.0
    container_name: emotion-echo-chat-svc
    restart: unless-stopped
    environment:
      <<: *logging-env
      # Stage 31 PR-11: Nacos 注册中心 + 配置中心
      NACOS_ENABLED:   "true"
      NACOS_ADDR:      "emotion-echo-nacos:8848"
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-emotion-echo-dev}"
      NACOS_HOT_RELOAD: "false"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL:  ${LOG_LEVEL:-INFO}
      GIN_MODE: release
      POSTGRES_DSN:        "host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_chat"
      KAFKA_BROKERS:       emotion-echo-kafka:9092
      SKYWALKING_OAP_ADDR: emotion-echo-sw-oap:11800
      SKYWALKING_ENABLED: "${SKYWALKING_ENABLED:-true}"
    # Stage 33 PR-20: 端口收紧
    expose:
      - "8890"
    volumes:
      - ../emotion-echo-chat-svc/etc/chat-api.yaml:/app/etc/chat-api.yaml:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      postgres:
        condition: service_started
      # 2026-09-04: 表结构必须先就位，否则启动即写不存在的列（发消息 500）
      emotion-echo-db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      skywalking-oap:
        condition: service_started

      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:8890/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Stage 26-P · analytics-svc 端口 8893(避开 ai-svc 占用 8892)
  emotion-echo-analytics-svc:
    build:
      context: ..
      dockerfile: emotion-echo-analytics-svc/Dockerfile
    image: emotion-echo/analytics-svc:v0.1.0
    container_name: emotion-echo-analytics-svc
    restart: unless-stopped
    environment:
      <<: *logging-env
      # Stage 31 PR-11: Nacos 注册中心 + 配置中心
      NACOS_ENABLED:   "true"
      NACOS_ADDR:      "emotion-echo-nacos:8848"
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-emotion-echo-dev}"
      NACOS_HOT_RELOAD: "false"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL:  ${LOG_LEVEL:-INFO}
      GIN_MODE: release
      POSTGRES_DSN:        "host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_analytics"
      KAFKA_BROKERS:       emotion-echo-kafka:9092
      # ADR-19 PR-A3.1: DLQ topic 启用真实 Kafka topic（默认 Noop 静默丢）
      KAFKA_DLQ_TOPIC:     chat-events-dlq
      SKYWALKING_OAP_ADDR: emotion-echo-sw-oap:11800
      SKYWALKING_ENABLED: "${SKYWALKING_ENABLED:-true}"
    # Stage 33 PR-20: 端口收紧
    expose:
      - "8893"
    volumes:
      - ../emotion-echo-analytics-svc/etc/analytics-api.yaml:/app/etc/analytics-api.yaml:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      postgres:
        condition: service_started
      # 2026-09-04: 表结构必须先就位，否则启动即写不存在的列（发消息 500）
      emotion-echo-db-migrate:
        condition: service_completed_successfully
      skywalking-oap:
        condition: service_started

      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:8893/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  emotion-echo-assessment-svc:
    build:
      context: ..
      dockerfile: emotion-echo-assessment-svc/Dockerfile
    image: emotion-echo/assessment-svc:v0.1.0
    container_name: emotion-echo-assessment-svc
    restart: unless-stopped
    environment:
      <<: *logging-env
      # Stage 31 PR-11: Nacos 注册中心 + 配置中心
      NACOS_ENABLED:   "true"
      NACOS_ADDR:      "emotion-echo-nacos:8848"
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-emotion-echo-dev}"
      NACOS_HOT_RELOAD: "false"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL:  ${LOG_LEVEL:-INFO}
      GIN_MODE: release
      POSTGRES_DSN:        "host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_assessment"
      SKYWALKING_OAP_ADDR: emotion-echo-sw-oap:11800
      SKYWALKING_ENABLED: "${SKYWALKING_ENABLED:-true}"
    # Stage 33 PR-20: 端口收紧
    expose:
      - "8889"
    volumes:
      - ../emotion-echo-assessment-svc/etc/assessment-api.yaml:/app/etc/assessment-api.yaml:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      postgres:
        condition: service_started
      # 2026-09-04: 表结构必须先就位，否则启动即写不存在的列（发消息 500）
      emotion-echo-db-migrate:
        condition: service_completed_successfully
      skywalking-oap:
        condition: service_started

      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:8889/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # =====================================================
  # emotion-llm-service: HTTP (FastAPI :8000) + gRPC (:50051) 双协议
  # =====================================================
  emotion-llm-service:
    build:
      context: ..
      dockerfile: emotion-llm-service/Dockerfile
    image: emotion-echo/llm-service:v0.1.0   # P0-4: pinned tag
    container_name: emotion-llm-service
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_started
    environment:
      <<: *logging-env
      # Stage 31 PR-11: Nacos 注册中心 + 配置中心
      NACOS_ENABLED:   "true"
      NACOS_ADDR:      "emotion-echo-nacos:8848"
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-emotion-echo-dev}"
      NACOS_HOT_RELOAD: "false"
      PYTHONUNBUFFERED: "1"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL:  ${LOG_LEVEL:-INFO}
      # gRPC auth (Stage 17)：生产必开 required + 强 key
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-key-change-me-please-32chars-min}
      INTERNAL_API_KEY_REQUIRED: ${INTERNAL_API_KEY_REQUIRED:-0}
      # mTLS (Stage 18)
      TLS_ENABLED: "1"
      TLS_CA_CERT: /app/etc/tls/ca.crt
      TLS_SERVER_CERT: /app/etc/tls/llm-server.crt
      TLS_SERVER_KEY: /app/etc/tls/llm-server.key
      TLS_REQUIRE_CLIENT_AUTH: "1"
    # Stage 33 PR-20: 端口收紧（ai-svc 容器内调，无外部需要）
    expose:
      - "8000"
      - "50051"
    volumes:
      - ../deploy/tls/llm-server.crt:/app/etc/tls/llm-server.crt:ro
      - ../deploy/tls/llm-server.key:/app/etc/tls/llm-server.key:ro
      - ../deploy/tls/ca.crt:/app/etc/tls/ca.crt:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  # =====================================================
  # emotion-echo-ai-svc: HTTP (Gin :8891) + gRPC (:8892) 双协议
  # =====================================================
  emotion-echo-ai-svc:
    build:
      context: ..
      dockerfile: emotion-echo-ai-svc/Dockerfile
    image: emotion-echo/ai-svc:v0.1.0   # P0-4: pinned tag
    container_name: emotion-echo-ai-svc
    restart: unless-stopped
    environment:
      <<: *logging-env
      # Stage 31 PR-11: Nacos 注册中心 + 配置中心
      NACOS_ENABLED:   "true"
      NACOS_ADDR:      "emotion-echo-nacos:8848"
      NACOS_NAMESPACE: "${NACOS_NAMESPACE:-emotion-echo-dev}"
      NACOS_HOT_RELOAD: "false"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL:  ${LOG_LEVEL:-INFO}
      GIN_MODE: release

      # Stage 20-P0-1: container DNS
      POSTGRES_DSN:        "host=emotion-echo-postgres port=5432 user=postgres password=postgres dbname=emotion_echo sslmode=disable search_path=emotion_echo_ai"
      KAFKA_BROKERS:       '["emotion-echo-kafka:9092"]'
      # Stage 36-D Bug 2 (G4): ai-svc Kafka consumer env (chat-svc → ai-svc → emotion_analysis)
      KAFKA_TOPIC:         "chat-events"
      KAFKA_GROUP:         "ai-svc"
      KAFKA_ENABLED:       "${KAFKA_ENABLED:-true}"
      # ADR-19 PR-A3.1: DLQ topic — ai-svc main.go:287 已读 KAFKA_DLQ_TOPIC
      # 配置即启用 KafkaDLQPublisher，毒消息进 chat-events-dlq 等待人工排查
      KAFKA_DLQ_TOPIC:     chat-events-dlq
      SKYWALKING_OAP_ADDR: emotion-echo-sw-oap:11800
      SKYWALKING_ENABLED: "${SKYWALKING_ENABLED:-true}"
      # Stage 19: ai-svc → emotion-llm-service 内部 FastAPI（dev / 离线）
      # Stage 36-B1: 真实 LLM（DeepSeek / OpenAI 兼容）通过 LLM_* env 注入。
      # ai-svc 直接读 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL / LLM_TIMEOUT
      # （main.go:419-432）；compose .env.local 覆盖，无 key 时 LLM_BASE_URL 空
      # → LLMFuser 禁用，FusionWorker 走 late_fuser_weighted fallback（Stage 34 默认行为）。
      # 留 LLM_INTERNAL_* 给内部 llm-service 兼容（Stage 19 路径）。
      LLM_BASE_URL:        ${LLM_BASE_URL:-}
      LLM_API_KEY:         ${LLM_API_KEY:-}
      LLM_MODEL:           ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT:         ${LLM_TIMEOUT:-3}
      LLM_GRPC_ADDR:       "emotion-llm-service:50051"
      LLM_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-key-change-me-please-32chars-min}

      # Stage 22-A.5: AI 模型服务（可选，未启用 ai profile 时不连）
      FER_BASE_URL:        ${FER_BASE_URL:-http://emotion-echo-fer:8004}
      SENSEVOICE_BASE_URL: ${SENSEVOICE_BASE_URL:-http://emotion-echo-sensevoice:8002}
      XTTS_BASE_URL:       ${XTTS_BASE_URL:-http://emotion-echo-xtts:8003}

    # Stage 33 PR-20: HTTP :8891 收紧；gRPC :8892 保留（dev 调试 gRPC client）
    ports:
      - "8892:8892"
    expose:
      - "8891"
    volumes:
      - ../deploy/tls/ai-client.crt:/app/etc/tls/ai-client.crt:ro
      - ../deploy/tls/ai-client.key:/app/etc/tls/ai-client.key:ro
      - ../deploy/tls/ca.crt:/app/etc/tls/ca.crt:ro
      - ../emotion-echo-ai-svc/etc/ai-api.yaml:/app/etc/ai-api.yaml:ro
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    depends_on:
      postgres:
        condition: service_started
      # 2026-09-04: 表结构必须先就位，否则启动即写不存在的列（发消息 500）
      emotion-echo-db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      skywalking-oap:
        condition: service_started
      emotion-llm-service:
        condition: service_healthy

      nacos:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O /dev/null http://localhost:8891/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # =====================================================
  # Stage 22-A.1 FER（Facial Expression Recognition）情绪识别
  #   profile: ai    （默认不启动，资源紧张机器可省 ~600MB RAM）
  # =====================================================
  emotion-echo-fer:
    build:
      context: ../emotion-echo-models
      dockerfile: FER/Dockerfile
    image: emotion-echo/fer:v0.1.0
    container_name: emotion-echo-fer
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      <<: *logging-env
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL:  ${LOG_LEVEL:-INFO}
    # Stage 33 PR-20: 端口收紧
    expose:
      - "8004"
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M       # OpenCV + fer 模型需要 ~600MB
        reservations:
          cpus: "0.3"
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=2)\""]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # =====================================================
  # Stage 22-A.2 SenseVoice（语音转写 + 情绪标签）
  #   profile: ai    （resources ~1.5GB，funasr + torch on CPU）
  # =====================================================
  emotion-echo-sensevoice:
    build:
      context: ../emotion-echo-models
      dockerfile: sensevoice-small/Dockerfile
    image: emotion-echo/sensevoice:v0.1.0
    container_name: emotion-echo-sensevoice
    restart: unless-stopped
    profiles: ["ai"]
    environment:
      <<: *logging-env
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL:  ${LOG_LEVEL:-INFO}
      SENSEVOICE_DEVICE: cpu
    # Stage 33 PR-20: 端口收紧
    expose:
      - "8002"
    volumes:
      # 模型首次启动会从 ModelScope 自动下载 ~200MB am.mvn + checkpoint
      # 若要预烘焙到镜像：取消下行注释并手动 copy 模型
      # - ../../emotion-echo-models/sensevoice-small/am.mvn:/app/am.mvn:ro
      - sensevoice-cache:/app/cache
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M      # funasr + torch ~1GB + room
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)\""]
      interval: 30s
      timeout: 5s
      # Stage 36-B5 fix: 模型已预烘焙进镜像（v0.1.2），但首次 /analyze 触发
      # funasr 模型加载 + torch GPU warmup ~60s。start_period 提到 300s 防止
      # docker healthcheck restart_policy 在 /analyze 处理期间误杀。
      start_period: 300s
      retries: 5

# =====================================================
# 网络：external，连接到 infra compose 定义的 app-network
# =====================================================
networks:
  app-network:
    external: true
    name: emotion-echo_app-network

volumes:
  sensevoice-cache:
    name: emotion-echo-sensevoice-cache
