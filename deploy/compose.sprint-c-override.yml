# Sprint C 测试用 override：仅 chat-svc 走 HTTP（其他 3 svc 走 gRPC）
# 原因：chat-svc gRPC 6 RPC 仍是 Unimplemented（决策 18 #27），Sprint D 修
#
# 用法：
#   docker compose -f deploy/docker-compose.infra.yml \
#                  -f deploy/docker-compose.apps.yml \
#                  -f deploy/compose.sprint-c-override.yml \
#                  up -d emotion-echo-web-bff
services:
  emotion-echo-web-bff:
    environment:
      CHAT_TRANSPORT: "http"
      USER_TRANSPORT: "grpc"
      ASSESSMENT_TRANSPORT: "grpc"
      ANALYTICS_TRANSPORT: "grpc"
