# APISIX 3.18 standalone 配置（Stage 32 PR-14）
# 本地 compose 编排，etcd host 用容器 DNS。
#
# 注意：此文件必须是完整 APISIX 配置（367 行），因为 apisix init 会把挂载的
# config.yaml 与 default_apisix_yaml 合并后再覆盖回去。如果只放片段，init 会
# 把缺失字段填默认值，并可能将 etcd.host 重置为 127.0.0.1:2379。
#
# 关键覆盖点（vs APISIX 默认值）：
#   - etcd.host: http://etcd:2379（容器名而非 localhost）
#   - listen_admin: 0.0.0.0:9180（暴露给 host 的 Admin API）
#   - prometheus.export_addr.ip: 0.0.0.0（暴露给 prometheus scrape）
#   - 移除 ssl: enable（避免 ssl_certificate_by_lua_block bug）
#
# 启动：docker compose -f deploy/docker-compose.infra.yml up -d
# 验证：curl http://localhost:9180/apisix/admin/routes \
#         -H "X-API-KEY: edd1c9f034335f136f87ad84b625c8f1"
---
plugins:
- real-ip
- ai
- client-control
- proxy-buffering
- proxy-control
- request-id
- zipkin
- ext-plugin-pre-req
- fault-injection
- mocking
- serverless-pre-function
- cors
- ip-restriction
- ua-restriction
- referer-restriction
- csrf
- uri-blocker
- request-validation
- chaitin-waf
- multi-auth
- openid-connect
- saml-auth
- cas-auth
- authz-casbin
- authz-keycloak
- wolf-rbac
- ldap-auth-advanced
- ldap-auth
- hmac-auth
- basic-auth
- jwt-auth
- jwe-decrypt
- key-auth
- dingtalk-auth
- feishu-auth
- acl
- consumer-restriction
- attach-consumer-label
- forward-auth
- opa
- authz-keycloak
- data-mask
- proxy-cache
- body-transformer
- ai-prompt-template
- ai-prompt-decorator
- ai-prompt-guard
- ai-rag
- ai-rate-limiting
- ai-proxy-multi
- ai-proxy
- ai-cache
- ai-aws-content-moderation
- ai-aliyun-content-moderation
- ai-lakera-guard
- proxy-mirror
- graphql-proxy-cache
- proxy-rewrite
- workflow
- api-breaker
- graphql-limit-count
- limit-conn
- limit-count
- limit-req
- gzip
- traffic-label
- traffic-split
- redirect
- response-rewrite
- oas-validator
- mcp-bridge
- degraphql
- kafka-proxy
- grpc-transcode
- grpc-web
- http-dubbo
- public-api
- prometheus
- datadog
- lago
- loki-logger
- elasticsearch-logger
- echo
- loggly
- http-logger
- splunk-hec-logging
- skywalking-logger
- google-cloud-logging
- sls-logger
- tcp-logger
- kafka-logger
- rocketmq-logger
- syslog
- udp-logger
- file-logger
- clickhouse-logger
- tencent-cloud-cls
- inspect
- example-plugin
- aws-lambda
- azure-functions
- openwhisk
- openfunction
- serverless-post-function
- ext-plugin-post-req
- ext-plugin-post-resp
- ai-request-rewrite
plugin_attr:
  dubbo-proxy:
    upstream_multiplex_count: 32
  proxy-mirror:
    timeout:
      send: 60s
      connect: 60s
      read: 60s
  opentelemetry:
    resource:
      service.name: APISIX
    collector:
      address: 127.0.0.1:4318
      request_headers:
        Authorization: token
      request_timeout: 3
    batch_span_processor:
      drop_on_queue_full: false
      max_queue_size: 1024
      batch_timeout: 2
      inactive_timeout: 1
      max_export_batch_size: 16
    trace_id_source: x-request-id
    set_ngx_var: false
  prometheus:
    export_uri: /apisix/prometheus/metrics
    metric_prefix: apisix_
    enable_export_server: true
    export_addr:
      ip: 0.0.0.0
      port: 9091
    refresh_interval: 15
  zipkin:
    set_ngx_var: false
  ai-proxy:
    http_client: ngx_http_ffi_client
  log-rotate:
    enable_compression: false
    timeout: 10000
    max_kept: 168
    interval: 3600
    max_size: -1
  skywalking:
    service_instance_name: APISIX Instance Name
    report_interval: 3
    endpoint_addr: http://127.0.0.1:12800
    service_name: APISIX
  inspect:
    hooks_file: /usr/local/apisix/plugin_inspect_hooks.lua
    delay: 3
  server-info:
    report_ttl: 60
# Stage 32 PR-14: 关键覆盖 — etcd host 用容器 DNS（而非默认 127.0.0.1）
etcd:
  prefix: /apisix
  host:
  - http://etcd:2379
  timeout: 30
  watch_timeout: 50
  startup_retry: 2
  tls:
    verify: true
nginx_config:
  http_admin_configuration_snippet: ''
  http_end_configuration_snippet: ''
  stream_configuration_snippet: ''
  error_log: logs/error.log
  error_log_level: debug
  worker_processes: auto
  stream:
    enable_access_log: false
    access_log: logs/access_stream.log
    access_log_format: $remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received
      $session_time
    access_log_format_escape: default
    metrics_zone_size: 1m
    lua_shared_dict:
      lrucache-lock-stream: 10m
      plugin-limit-conn-stream: 10m
      worker-events-stream: 10m
      tars-stream: 1m
      etcd-cluster-health-check-stream: 10m
  worker_rlimit_nofile: 20480
  worker_shutdown_timeout: 240s
  event:
    worker_connections: 10620
  max_running_timers: 4096
  meta:
    lua_shared_dict:
      prometheus-cache: 10m
      upstream-healthcheck: 10m
      status-report: 1m
      standalone-config: 10m
      prometheus-metrics: 128m
  http:
    access_log_buffer: 16384
    keepalive_timeout: 60s
    client_header_timeout: 60s
    client_body_timeout: 60s
    client_max_body_size: 0
    send_timeout: 10s
    underscores_in_headers: 'on'
    real_ip_header: X-Real-IP
    real_ip_recursive: 'off'
    real_ip_from:
    - 127.0.0.1
    - 'unix:'
    proxy_ssl_server_name: true
    lua_shared_dict:
      plugin-api-breaker: 10m
      discovery: 1m
      jwks: 1m
      introspection: 10m
      access-tokens: 1m
      ext-plugin: 1m
      mcp-session: 10m
      tars: 1m
      cas-auth: 10m
      internal-status: 10m
      worker-events: 10m
      lrucache-lock: 10m
      balancer-ewma: 10m
      balancer-ewma-locks: 10m
      balancer-ewma-last-touched-at: 10m
      etcd-cluster-health-check: 10m
      plugin-ai-rate-limiting: 10m
      plugin-ai-rate-limiting-reset-header: 10m
      plugin-limit-conn: 10m
      plugin-limit-conn-redis-cluster-slot-lock: 1m
      plugin-limit-req-redis-cluster-slot-lock: 1m
      plugin-limit-req: 10m
      plugin-limit-count: 10m
      plugin-limit-count-lock: 1m
      plugin-limit-count-redis-cluster-slot-lock: 1m
      ocsp-stapling: 10m
      tracing_buffer: 32m
      plugin-graphql-limit-count: 10m
      plugin-graphql-limit-count-reset-header: 10m
      prometheus-metrics: 128m
    charset: utf-8
    access_log_format_escape: default
    variables_hash_max_size: 2048
    enable_access_log: true
    access_log: logs/access.log
    upstream:
      keepalive: 320
      keepalive_timeout: 60s
      keepalive_requests: 1000
    access_log_format: $remote_addr - $remote_user [$time_local] $http_host "$request"
      $status $body_bytes_sent $request_time "$http_referer" "$http_user_agent" $upstream_addr
      $upstream_status $upstream_response_time "$upstream_scheme://$upstream_host$upstream_uri"
      "$apisix_request_id"
  max_pending_timers: 16384
  enable_cpu_affinity: false
  main_configuration_snippet: ''
  http_configuration_snippet: ''
  http_server_configuration_snippet: ''
  http_server_location_configuration_snippet: ''
graphql:
  max_size: 1048576
deployment:
  role: traditional
  role_control_plane:
    config_provider: etcd
  role_traditional:
    config_provider: etcd
    listen_admin: 0.0.0.0:9180
  role_data_plane:
    config_provider: etcd
  config_provider: etcd
  admin:
    admin_key_required: true
    admin_api_version: v3
    enable_admin_cors: true
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    admin_key:
    - name: admin
      key: WhZEPlrGviCSXlKFfALZlQWinluoGAbj
      role: admin
    enable_admin_ui: true
    allow_admin:
    - 127.0.0.1/32
    - 0.0.0.0/0
  etcd:
    prefix: /apisix
    host:
    - http://etcd:2379
    timeout: 30
    watch_timeout: 50
    startup_retry: 2
    tls:
      verify: true
stream_plugins:
- ip-restriction
- limit-conn
- mqtt-proxy
- syslog
- traffic-split
apisix:
  enable_dev_mode: false
  enable_reuseport: true
  enable_ipv6: false
  extra_lua_path: ''
  extra_lua_cpath: ''
  control:
    ip: 0.0.0.0
    port: 9092
  tracing: false
  enable_http2: true
  router:
    http: radixtree_host_uri
    ssl: radixtree_sni
  disable_upstream_healthcheck: false
  normalize_uri_like_servlet: false
  resolver_timeout: 5
  max_post_args_readable_size: 64
  lru:
    secret:
      neg_ttl: 60
      neg_count: 512
      ttl: 300
      count: 512
  data_encryption:
    keyring:
    - qeddd145sfvddff3
    - edd1c9f0985e76a2
    enable_encrypt_fields: true
  worker_startup_time_threshold: 60
  enable_server_tokens: true
  show_upstream_status_in_response_header: false
  enable_resolv_search_opt: true
  match_uri_encoded_slash: false
  ssl:
    enable: false  # Stage 32 PR-14: 关闭 SSL 避开 3.9 ssl_certificate_by_lua_block bug
    ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl_session_tickets: false
    ssl_trusted_certificate: /etc/ssl/certs/ca-certificates.crt
    listen:
    - enable_http3: false
      port: 9443
    ssl_protocols: TLSv1.2 TLSv1.3
  delete_uri_tail_slash: false
  proxy_mode: http
  proxy_cache:
    zones:
    - cache_levels: '1:2'
      name: disk_cache_one
      memory_size: 50m
      disk_size: 1G
      disk_path: /tmp/disk_cache_one
    - memory_size: 50m
      name: memory_cache
    cache_ttl: 10s
  enable_control: true
  disable_sync_configuration_during_start: false
  enable_admin: true
  enable_http2: false  # Stage 32 PR-14 fix: 关闭 HTTP/2 避开 3.18 镜像 nginx template bug
  node_listen: 9080
...
