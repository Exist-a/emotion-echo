# PR-OBS-4: Grafana datasource auto-provisioning
#
# 镜像: grafana/grafana:10.4.2 (与 charts/emotion-echo/charts/grafana/Chart.yaml 同步)
# 启动时 Grafana 自动加载本文件注册 prometheus datasource,无需手动配置。
#
# Grafana provisioning 文件必须在容器内 /etc/grafana/provisioning/datasources/ 路径,
# docker-compose.infra.yml 的 grafana 服务会把 ./deploy/grafana/provisioning 挂到该路径。

apiVersion: 1

datasources:
  # Stage 74: 显式 uid —— kafka-consumer-lag.json / emotion-echo-overview.json
  # 的 panel datasource 硬编码引用 uid="prometheus"，不写则 grafana 生成随机 uid
  # 导致面板 datasource not found（smoke_observability.py 断言 10b）
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  # PR-OBS-5: Loki datasource (logs layer)
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000

  # CL-03 Phase 4c（CL-D-18=B）：PostgreSQL 数据源 —— 给「DLQ 回放记录」面板用。
  # 为什么需要：回放工具是人工 CLI（无 /metrics 端点）⇒ 回放结果落 PG 表
  #   emotion_echo_analytics.dlq_replay_runs，本数据源让 Grafana 直接 SQL 读它。
  #
  # 🔴 CL-F-24（2026-10-16）：凭据一律**环境注入**（`${GF_PG_USER}` / `${GF_PG_PASSWORD}`），
  #   **本文件不得再出现字面量用户名/口令** —— 原因：provisioning 文件 dev 与 prod **是同一份**，
  #   写死 dev 口令（postgres/postgres）等于让 prod 也用超级用户只读查库。
  #   · dev：compose 的 grafana 服务给了 dev 默认值（与全栈 postgres/postgres 一致）；
  #   · prod：必须由 secret/CI 注入，且账号应为**只读**（MR-4 的 `analytics_reader`，
  #     见 AGENTS §2.4）；**本文件故意不给默认值** —— 实测漏配时的行为是：
  #     数据源**仍会注册**（Grafana 不校凭据），但它的**健康检查立刻报错**
  #     （`pq: no PostgreSQL user name specified in startup packet`，/health 返 status=ERROR），
  #     即"loud 但延迟到健康检查"而非静默可用。
  #   守卫：`deploy/obs_monitoring.test.js` 新增组 ⑧ 钉住"不得含字面量口令"。
  - name: PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: emotion_echo
    user: ${GF_PG_USER}
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: ${GF_PG_PASSWORD}
