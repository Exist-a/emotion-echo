apiVersion: v2
name: emotion-echo
description: |
  Emotion-Echo umbrella chart - Emotion-AI monorepo full-stack deployment.

  Subcharts included (see charts/ directory):
    - Data layer:       postgres, redis, kafka, skywalking
    - Business layer:   user-svc, chat-svc, analytics-svc, assessment-svc,
                        ai-svc, llm-service, web-bff
    - AI profile:       fer, sensevoice, xtts (toggleable via values)
    - Frontend:         web
    - Observability:    prometheus (Stage 28-A), grafana, loki, alertmanager
    - Stage 30: BFF 替代了原 APISIX 网关职责，apisix-routes 子 chart 已移除

type: application
version: 0.1.0
appVersion: "0.1.0"

# Subchart dependencies — referenced from charts/ directory using local paths.
# No `helm dependency update` needed: dependencies resolve at install time.
dependencies:
  - name: postgres
    version: "0.1.0"
    condition: postgres.enabled
  - name: redis
    version: "0.1.0"
    condition: redis.enabled
  - name: kafka
    version: "0.1.0"
    condition: kafka.enabled
  - name: skywalking
    version: "0.1.0"
    condition: skywalking.enabled
  - name: nacos
    version: "0.1.0"
    condition: nacos.enabled
  - name: user-svc
    version: "0.1.0"
    condition: user-svc.enabled
  - name: chat-svc
    version: "0.1.0"
    condition: chat-svc.enabled
  - name: analytics-svc
    version: "0.1.0"
    condition: analytics-svc.enabled
  - name: assessment-svc
    version: "0.1.0"
    condition: assessment-svc.enabled
  - name: ai-svc
    version: "0.1.0"
    condition: ai-svc.enabled
  - name: llm-service
    version: "0.1.0"
    condition: llm-service.enabled
  - name: fer
    version: "0.1.0"
    condition: fer.enabled
  - name: sensevoice
    version: "0.1.0"
    condition: sensevoice.enabled
  - name: xtts
    version: "0.1.0"
    condition: xtts.enabled
  - name: web
    version: "0.1.0"
    condition: web.enabled
  - name: web-bff
    version: "0.1.0"
    condition: web-bff.enabled
  # Stage 30: APISIX 网关已退役（BFF 替代网关职责）。apisix-routes 子 chart 移除，
  # 历史文档保留在 docs/ 与 plans/ 中作为演进参考。
  # Stage 28: observability stack. Each subchart can be disabled
  # individually via `<name>.enabled: false` in values overlay.
  - name: prometheus
    version: "0.1.0"
    condition: prometheus.enabled
  - name: grafana
    version: "0.1.0"
    condition: grafana.enabled
  - name: loki
    version: "0.1.0"
    condition: loki.enabled
  - name: alertmanager
    version: "0.1.0"
    condition: alertmanager.enabled
  # Stage 29-A: HTTPS via cert-manager + self-signed ClusterIssuer.
  # Disabled by default; opt in via `cert-manager.enabled: true`.
  - name: cert-manager
    version: "0.1.0"
    condition: cert-manager.enabled