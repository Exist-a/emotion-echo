apiVersion: v1
kind: ConfigMap
metadata:
  name: web-bff-config
  namespace: ee-app
  labels:
    {{- include "web-bff.labels" . | nindent 4 }}
data:
  web-bff.yaml: |
    Name: web-bff
    Host: 0.0.0.0
    Port: 8894
    SkyWalking:
      OAPAddr: skywalking-oap.ee-data:11800
      ServiceName: emotion-echo-web-bff
      Enabled: true
    UserService:
      BaseURL: http://user-svc.ee-app.svc.cluster.local:8888
      TimeoutMs: 5000
    ChatService:
      BaseURL: http://chat-svc.ee-app.svc.cluster.local:8890
      TimeoutMs: 5000
    AssessmentService:
      BaseURL: http://assessment-svc.ee-app.svc.cluster.local:8889
      TimeoutMs: 5000
    AnalyticsService:
      BaseURL: http://analytics-svc.ee-app.svc.cluster.local:8904
      TimeoutMs: 5000
    AIService:
      HTTPAddr: http://ai-svc.ee-app.svc.cluster.local:8891
      GRPCAddr: ai-svc.ee-app.svc.cluster.local:8892
      TimeoutMs: 5000
    XTTS:
      BaseURL: http://xtts.ee-app.svc.cluster.local:8003
      TimeoutMs: 30000
    Health:
      TimeoutMs: 2000
    Auth:
      JWTSecret: dev-bff-secret
      TokenTTLSeconds: 86400
