apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bff
  namespace: ee-app
  labels:
    {{- include "web-bff.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "web-bff.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-bff.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.port }}"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      containers:
        - name: web-bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: INFO
            - name: TZ
              value: Asia/Shanghai
            - name: BFF_JWT_SECRET
              value: "dev-bff-secret"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /app/etc
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: web-bff-config
        - name: tmp
          emptyDir: {}
