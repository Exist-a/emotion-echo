apiVersion: v1
kind: Service
metadata:
  name: web-bff
  namespace: ee-app
  labels:
    {{- include "web-bff.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "web-bff.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
