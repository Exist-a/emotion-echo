# Upstreams map svc name -> (k8s service fqdn, port).
# Mirrors deploy/apisix/apisix.yaml 1:1.
upstreams:
  - id: user-svc
    namespace: ee-app
    port: 8888
  - id: chat-svc
    namespace: ee-app
    port: 8890
  - id: analytics-svc
    namespace: ee-app
    port: 8893
  - id: assessment-svc
    namespace: ee-app
    port: 8889
  - id: ai-svc
    namespace: ee-app
    port: 8891
  - id: mock-ping
    namespace: ee-system
    port: 1980

# Stage 29-D: per-family TLS grouping.
#
# Each family is one cert-manager Certificate + one APISIX ApisixTls +
# N existing ApisixRoutes annotated with `match.hosts`. Why per-family
# (not per-route, not single-host):
#   - cert-manager best practice: one Certificate per independent
#     identity; shared SAN certs couple unrelated lifecycles.
#     See https://cert-manager.io/docs/usage/certificate/.
#   - APISIX ApisixTls.hosts is an array — one Secret serves many SNIs.
#     See https://apisix.apache.org/blog/2021/10/22/cert-manager-in-ingress/.
#   - 15 certs is operator overhead; 1 cert for 15 unrelated routes is
#     one point of failure. 5 families split the difference.
#
# `enabled: false` means the templating emits nothing (existing routes
# continue working over plain HTTP — pre-29-D behavior). Turn on via
# values-dev.yaml -> apisixRoutes.tls.enabled: true.
tls:
  enabled: false
  clusterIssuer: selfsigned-issuer
  rotationPolicy: Always
  renewBeforePercentage: 33
  families:
    - name: user
      hostname: user.echo.local
      routes: [r-user-me, r-user-by-id, r-user-update]
    - name: chat
      hostname: chat.echo.local
      routes: [r-conv-create, r-msg-list, r-msg-send]
    - name: analytics
      hostname: analytics.echo.local
      routes:
        - r-analytics-health
        - r-reports-daily
        - r-reports-trend
        - r-ub-day-night
        - r-ub-depth
        - r-ub-frequency
        - r-mh-assessment
        - r-mh-history
        - r-mh-trigger
        - r-mh-trend
    - name: assessment
      hostname: assessment.echo.local
      routes:
        - r-surveys
        - r-survey-get
        - r-survey-submit
        - r-survey-results-list
        - r-survey-results-get
    - name: ai
      hostname: ai.echo.local
      routes: [r-emotion-by-msg, r-emotion-by-conv, r-ai-health]