{{- /* Route 16: r-ping — intentionally NOT in any TLS family.
     Stays HTTP (no SNI termination). Operators hit /ping on plain
     :9080 for liveness probes — TLS for a static mock is overkill. */ -}}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: r-ping
  namespace: ee-app
spec:
  http:
    - name: ping
      match:
        paths: ["/ping"]
      backends:
        - serviceName: {{ $upstreamMockPing }}
          servicePort: 1980