# 16 ApisixRoute CRDs - transcribed from deploy/apisix/apisix.yaml 1:1.
# Field semantics map directly to APISIX etcd JSON schema.
#
# Stage 29-D: when .Values.tls.enabled is true, each route that belongs
# to a TLS family gets an additional `match.hosts: [<family.hostname>]`
# entry. This is the "dual-stack" mode — HTTP (no hosts) keeps the route
# reachable on plain :9080 for backward compat AND HTTPS (:9443 with
# family SNI) serves the same route. Operators can cut HTTP later in a
# follow-up by setting tls.enabled + an additional flag (deferred).
{{- $upstreamUser := "user-svc" }}
{{- $upstreamChat := "chat-svc" }}
{{- $upstreamAnalytics := "analytics-svc" }}
{{- $upstreamAssessment := "assessment-svc" }}
{{- $upstreamAi := "ai-svc" }}
{{- $upstreamMockPing := "mock-ping" }}

{{- /*
  familyHostsByRoute: map[routeName] = hostname.
  Computed once from .Values.tls.families when tls.enabled; otherwise
  empty map -> no hosts block is emitted.
*/ -}}
{{- $familyHosts := dict -}}
{{- if .Values.tls.enabled -}}
  {{- range .Values.tls.families -}}
    {{- $hostname := .hostname -}}
    {{- range .routes -}}
      {{- $_ := set $familyHosts . $hostname -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /*
  hostsFor returns the hosts list for a given route name, or empty
  list if the route is not in any family. Used inline in match block.
*/ -}}

{{- /* Route 1: r-user-me */ -}}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: r-user-me
  namespace: ee-app
spec:
  http:
    - name: user-me
      match:
        {{- if hasKey $familyHosts "r-user-me" }}
        hosts:
          - {{ index $familyHosts "r-user-me" | quote }}
        {{- end }}
        paths: ["/api/v1/users/me"]
        methods: ["GET"]
      backends:
        - serviceName: {{ $upstreamUser }}
          servicePort: 8888

