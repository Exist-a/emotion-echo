{{- /*
  apisix-routes/templates/tls-routes.yaml — Stage 29-D

  Per-family TLS retrofit for the 15 remaining business ApisixRoutes
  (Grafana already on TLS in Stage 29-A.5).

  For each entry under .Values.tls.families, when .Values.tls.enabled is
  true, emits TWO coupled resources:

    1. Certificate (cert-manager.io/v1) — instructs cert-manager to
       mint a self-signed cert into the Secret <name>-family-tls in
       namespace ee-app.
    2. ApisixTls (apisix.apache.org/v2) — tells APISIX data plane to
       terminate TLS for <hostname> using the same Secret. APISIX
       watches this CR and reloads certs automatically when the Secret
       rotates (no controller annotation dance required).

  Why this design (vs. K8s Ingress + cert-manager.io annotation):

    * The K8s Ingress controller in this cluster is APISIX (data plane
      apache/apisix:3.10.0-debian), not ingress-nginx. K8s Ingress
      has no controller in kind — TLS handshake never works.
    * cert-manager annotates K8s Ingresses; APISIX is configured via
      ApisixTls CRDs. cert-manager DOES write the resulting certificate
      to a Secret, which APISIX watches independently. So Certificate +
      ApisixTls referencing the same Secret is the canonical end-to-end
      path (Stage 29-A.5 set this precedent for Grafana).

  cert-manager 2024+ best practice applied here:
    * rotationPolicy: Always  — prevent reusing an exposed private key
    * renewBeforePercentage: 33 — avoid renewal loops from issuer
      clock-skew adjustments (see cert-manager docs §controlling-when-
      certificates-are-renewed). We use a percentage rather than the
      absolute `renewBefore: 720h` Grafana template uses; Stage 29-D.5
      refactor could unify Grafana to the same scheme.

  Knobs (set under `tls:` in values.yaml):
    enabled:               bool (default false)
    clusterIssuer:         string (default selfsigned-issuer)
    rotationPolicy:        string (default Always)
    renewBeforePercentage: int (default 33, percent)
    families:              list of {name, hostname, routes[]}
*/ -}}
{{- if .Values.tls.enabled -}}
{{- $ns := "ee-app" -}}
{{- $issuer := default "selfsigned-issuer" .Values.tls.clusterIssuer -}}
{{- $rotPol := default "Always" .Values.tls.rotationPolicy -}}
{{- $renewPct := default 33 .Values.tls.renewBeforePercentage -}}
{{- range .Values.tls.families }}
{{- $secretName := printf "%s-family-tls" .name -}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "apisix-routes.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tls
    emotion-echo.local/tls-family: {{ .name | quote }}
spec:
  secretName: {{ $secretName | quote }}
  duration: 2160h
  renewBeforePercentage: {{ $renewPct }}
  rotationPolicy: {{ $rotPol }}
  issuerRef:
    name: {{ $issuer | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .hostname | quote }}
  usages:
    - digital signature
    - key encipherment
    - server auth
---
apiVersion: apisix.apache.org/v2
kind: ApisixTls
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "apisix-routes.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tls
    emotion-echo.local/tls-family: {{ .name | quote }}
spec:
  hosts:
    - {{ .hostname | quote }}
  secret:
    name: {{ $secretName | quote }}
    namespace: {{ $ns | quote }}
---
{{- end }}
{{- end }}