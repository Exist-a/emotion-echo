apiVersion: v1
kind: Service
metadata:
  name: analytics-svc
  namespace: ee-app
  labels:
    {{- include "analytics-svc.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
    # Stage 72：gRPC server :8885（AnalyticsService 给内部 BFF，对齐 compose expose）
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: {{ .Values.service.grpcPort }}
  selector:
    {{- include "analytics-svc.selectorLabels" . | nindent 4 }}
