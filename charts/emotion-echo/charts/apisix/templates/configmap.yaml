apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apisix.fullname" . }}-config
  labels:
    {{- include "apisix.labels" . | nindent 4 }}
data:
  # APISIX standalone 模式配置（Stage 32 PR-13）
  # config_provider=etcd：路由/上游/插件持久化到 etcd subchart
  # 部署形态：traditional（单实例）+ control + data plane 同进程
  config.yaml: |
    apisix:
      node_listen: {{ .Values.httpPort }}
      enable_ipv6: false
      enable_control: true
      control:
        ip: "0.0.0.0"
        port: 9092
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
        listen_admin: 0.0.0.0:{{ .Values.adminPort }}
      role_control_plane:
        config_provider: etcd
      role_data_plane:
        config_provider: etcd
    etcd:
      host:
        - http://{{ include "etcd.fullname" . }}:{{ .Values.etcd.clientPort }}
      prefix: /apisix
      timeout: 30
    plugin_attr:
      prometheus:
        export_addr:
          ip: 0.0.0.0
          port: {{ .Values.prometheusPort }}
    # 2026-09-04 修正 PR-3：原写成 plugin_attr.nacos-discovery，两处都不对——
    #   1. Nacos 发现的配置段是**顶层 discovery.nacos**，不是 plugin_attr 子键
    #   2. 字段名是 prefix/fetch_interval/timeout；namespace 不属这里
    #      （namespace_id / group_name 是 per-service 参数，在 upstream.discovery_args）
    # 依据 https://apisix.apache.org/docs/apisix/discovery/nacos/ ，
    # 并与 deploy/apisix/config.yaml 的 dev 配置保持同构。
    discovery:
      nacos:
        host:
          - "http://{{ if .Values.nacos.username }}{{ .Values.nacos.username }}:{{ .Values.nacos.password }}@{{ end }}{{ .Values.nacos.host }}:{{ .Values.nacos.port }}"
        prefix: "/nacos/v1/"
        fetch_interval: {{ .Values.nacos.fetchInterval | default 30 }}
        weight: {{ .Values.nacos.weight | default 100 }}
        timeout:
          connect: 2000
          send: 2000
          read: 5000
