{{/*
E2E-22: Prometheus 告警规则的 k8s 侧 ConfigMap。

为什么需要这个文件（2026-09-29 实测缺陷，非假想）:
  prometheus-config 的 rule_files 声明了 /etc/prometheus/rules/*.yml，
  但该 ConfigMap 的 data **只有 prometheus.yml 一个 key**，而 deployment
  也只挂了 config(整个 /etc/prometheus) 与 data(/prometheus) 两个 volume。
  ⇒ 规则目录为空 ⇒ rule_files 命中**空 glob** ⇒ Prometheus **不报错**、
  静默加载 0 条规则、0 条告警。与 E2E-F-147（promtail 无权限读日志但 Pod 全绿）
  属同一类"配置声明了但实际没接上"的静默失效。

维护约定（防止 dev / k8s 两份规则漂移）:
  deploy/prometheus/rules/*.yml 是**唯一事实源**；本文件内联其内容。
  两份的 alert 名一致性由 deploy/obs_monitoring.test.js 的
  "规则名双向相等"断言兜底 —— 改任一侧而忘改另一侧，契约测试立即红。

⚠️ 运行时未验证: 本机无 k8s 集群，本文件仅通过 helm template 渲染回归
  （scripts/test_helm_prometheus_render.sh，含负向对照）。生产部署时需实测一次。
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: {{ include "prometheus.namespaceObservability" . }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  # --- 与 deploy/prometheus/rules/outbox-dead.yml 保持一致 ---
  outbox-dead.yml: |
    groups:
      - name: outbox-dead
        interval: 30s
        rules:
          - alert: OutboxEventsDead
            expr: emotion_echo_outbox_events_dead_total > 0
            for: 1m
            labels:
              severity: critical
              component: chat-svc
            annotations:
              summary: "chat-svc outbox row(s) marked dead (events permanently dropped)"
              description: |
                outbox dead counter = {{ `{{ $value }}` }}。
                有事件行超过 MaxAttempts 仍发布失败，已被标记 dead 并永久放弃。
                查 chat-svc 日志 + emotion_echo_chat.outbox_events 表 last_error 排查根因。

  # --- 与 deploy/prometheus/rules/kafka-lag.yml 保持一致 ---
  kafka-lag.yml: |
    groups:
      - name: kafka-consumer-lag
        interval: 30s
        rules:
          - alert: KafkaConsumerGroupLagHigh
            expr: kafka_consumergroup_lag{consumergroup=~"ai-svc|analytics-svc"} > 10000
            for: 5m
            labels:
              severity: warning
              component: kafka
            annotations:
              summary: "Kafka consumer group {{ `{{ $labels.consumergroup }}` }} lag high"
              description: |
                Consumer group {{ `{{ $labels.consumergroup }}` }} lag = {{ `{{ $value }}` }} on partition {{ `{{ $labels.partition }}` }}
                (topic={{ `{{ $labels.topic }}` }}, threshold=10000, duration=5m)
                检查 consumer 进程状态 + Kafka broker 健康。

  # --- 与 deploy/prometheus/rules/kafka-dlq.yml 保持一致 ---
  kafka-dlq.yml: |
    groups:
      - name: kafka-dlq
        interval: 30s
        rules:
          - alert: AIDLQPublishFailure
            expr: rate(emotion_echo_dlq_publish_total{result="failure"}[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
              component: ai-svc
            annotations:
              summary: "ai-svc DLQ publish failure rate > 0.1/s over 5m"
              description: |
                ai-svc DLQ.Publish 失败率 = {{ `{{ $value }}` }}/s。
                业务消息 + DLQ 双失败。**CL-D-17=A 起语义已变**：DLQ 投递失败时**不再 MarkMessage**，
                消息留待重投（Kafka 恢复后自然重试）—— 不再是"已 Mark 无法挽回"。
                查 ai-svc 日志 "consumer DLQ publish failed (will NOT mark; message stays for redelivery)" 找 broker 错误。

          - alert: AnalyticsDLQPublishFailure
            expr: rate(emotion_echo_analytics_dlq_publish_total{result="failure"}[5m]) > 0.1
            for: 5m
            labels:
              severity: critical
              component: analytics-svc
            annotations:
              summary: "analytics-svc DLQ publish failure rate > 0.1/s over 5m"
              description: |
                analytics-svc DLQ.Publish 失败率 = {{ `{{ $value }}` }}/s。
                user_behavior_events 落库失败的毒消息 + DLQ 双失败（同上：CL-D-17=A 起**不 Mark**，消息留待重投）。
                查 analytics-svc 日志 "DLQ publish failed (will NOT mark; message stays for redelivery)" 找 broker 错误。

          # CL-03 Phase 4a: 堆积告警（DLQ 无 consumer ⇒ 进入即堆积）
          # CL-F-23（2026-10-16 实测）: oldest_offset 可采但**只能表达留存总量**（回放不删消息），
          #   不可表达"未处理深度" ⇒ 未新增深度告警；见规则注释与账本 CL-F-27
          - alert: DLQMessagesAccumulating
            expr: sum(increase(kafka_topic_partition_current_offset{topic="chat-events-dlq"}[10m])) > 0
            for: 0m
            labels:
              severity: warning
              component: kafka
            annotations:
              summary: "chat-events-dlq 近 10 分钟有新消息进入（DLQ 无消费者 ⇒ 进入即堆积）"
              description: |
                近 10 分钟 chat-events-dlq 写入增长 = {{ `{{ $value }}` }} 条。
                DLQ 无常驻 consumer（人工回放设计）⇒ 进入即堆积，需查看并择机回放。
                处置：看板 kafka-consumer-lag 的 DLQ 面板 → grep 服务日志 → replay_dlq 回放。

  # --- 与 deploy/prometheus/rules/observability-self.yml 保持一致（E2E-22 新增）---
  # 注: k8s 侧 PrometheusTargetDown 依赖 up 指标，kubernetes-pods SD job 下同样有效
  #     （被 scrape 的 Pod 挂掉后 Pod 对象仍在，target 变 down）。
  observability-self.yml: |
    groups:
      - name: observability-self
        interval: 30s
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: critical
              component: observability
            annotations:
              summary: "scrape target DOWN: {{ `{{ $labels.job }}` }} / {{ `{{ $labels.instance }}` }}"
              description: |
                target {{ `{{ $labels.instance }}` }}（job={{ `{{ $labels.job }}` }}）已持续 2 分钟不可抓取。
                若 instance 属观测面自身，则该组件当前**无任何指标** ——
                依赖它的告警将静默失效。

          - alert: AlertmanagerNotificationFailing
            expr: sum(rate(alertmanager_notifications_failed_total[5m])) > 0
            for: 5m
            labels:
              severity: critical
              component: alertmanager
            annotations:
              summary: "Alertmanager 通知投递持续失败（告警响了但发不出去）"
              description: |
                alertmanager_notifications_failed_total 的 rate > 0 已持续 5 分钟。
                后果: 告警已进入 Alertmanager 但**没有送达任何 receiver** ——
                比不告警更危险，因为它制造"已有告警覆盖"的虚假安全感。

          - alert: AlertmanagerClusterDegraded
            expr: alertmanager_cluster_members < 1
            for: 5m
            labels:
              severity: critical
              component: alertmanager
            annotations:
              summary: "Alertmanager 集群成员数为 0"
              description: |
                alertmanager_cluster_members = {{ `{{ $value }}` }}，应至少为 1。
                为 0 表示 gossip 环未建立，Alertmanager 无法在接收方之间复制告警。

  # --- 与 deploy/prometheus/rules/cl01-health-business.yml 保持一致（CL-01 新增）---
  # 口径: 业务（fusion 融合链路）+ 可靠性（DLQ 投递）+ 健康（/health/ready 就绪）。
  # 注: /health/ready 的就绪信号取自 emotion_echo_http_requests_total 的 status 标签
  #     （各 svc HTTP 中间件写入）；k8s 侧 readinessProbe 打的是同一端点 ⇒ 同样有效。
  cl01-health-business.yml: |
    groups:
      - name: cl01-business-fusion
        interval: 30s
        rules:
          - alert: FusionCallFailing
            expr: increase(emotion_fusion_calls_total{result="failure"}[10m]) > 0
            for: 0m
            labels:
              severity: warning
              component: ai
            annotations:
              summary: "融合调用失败（modality={{ `{{ $labels.modality }}` }}）"
              description: |
                近 10 分钟有 {{ `{{ $value | printf "%.0f" }}` }} 次融合以 failure 收尾。
                融合失败会让 /reports/* 的情绪分布退化为"只有文本"甚至空。

          - alert: FusionFallbackActive
            expr: increase(emotion_echo_fusion_fallback_total[10m]) > 0
            for: 0m
            labels:
              severity: warning
              component: ai
            annotations:
              summary: "融合走了回退路径（stage={{ `{{ $labels.stage }}` }}）"
              description: |
                近 10 分钟 fusion 回退 {{ `{{ $value | printf "%.0f" }}` }} 次，stage={{ `{{ $labels.stage }}` }}。
                llm_to_late = LLM fuser 不可用 → 加权 late fusion 兜底；
                late_to_skip = 连兜底都不可用 → 跳过融合。

          - alert: FusionWorkerStalled
            expr: (increase(emotion_echo_fusion_worker_tick_total{outcome="ok"}[10m]) or vector(0)) == 0
            for: 10m
            labels:
              severity: warning
              component: ai
            annotations:
              summary: "FusionWorker 10 分钟无成功 tick"
              description: |
                ai-svc 的 FusionWorker 每 5s 应产生一次 outcome=ok 的 tick。
                10 分钟零增长说明循环停摆（`or vector(0)` 让 series 消失时也能判停摆）。

      - name: cl01-reliability
        interval: 30s
        rules:
          - alert: DLQPublishFailing
            expr: |
              increase(emotion_echo_dlq_publish_total{result="failure"}[10m]) > 0
              or increase(emotion_echo_analytics_dlq_publish_total{result="failure"}[10m]) > 0
            for: 0m
            labels:
              severity: critical
              component: kafka
            annotations:
              summary: "DLQ 投递失败（instance={{ `{{ $labels.instance }}` }}）"
              description: |
                近 10 分钟 DLQ 投递失败 {{ `{{ $value | printf "%.0f" }}` }} 次。
                业务消息已 MarkMessage 前进且 DLQ 也没收到 ⇒ 该事件**彻底丢失**。

          - alert: ServiceNotReady
            expr: increase(emotion_echo_http_requests_total{path="/health/ready",status!~"2.."}[5m]) > 0
            for: 0m
            labels:
              severity: critical
              component: health
            annotations:
              summary: "服务就绪探针失败：{{ `{{ $labels.service }}` }}（HTTP {{ `{{ $labels.status }}` }}）"
              description: |
                {{ `{{ $labels.service }}` }} 的 /health/ready 近 5 分钟返回非 2xx 共
                {{ `{{ $value | printf "%.0f" }}` }} 次。readiness 语义 = 依赖可用性，
                503 表示该实例**实际不可用**（即使进程还在跑、up 仍为 1）。

          - alert: HealthProbeMissing
            expr: (increase(emotion_echo_http_requests_total{path="/health/ready",status="200"}[10m]) or vector(0)) == 0
            for: 10m
            labels:
              severity: warning
              component: health
            annotations:
              summary: "就绪探针 10 分钟无成功样本：{{ `{{ $labels.service }}` }}"
              description: |
                就绪探针每 30s 打一次 /health/ready，10 分钟窗口内应远多于 0 次。
                零增长说明探针被摘掉、或服务已卡死不再处理请求。
                （Pod 重建后 counter 归零，故带 for: 10m 避开该瞬态。）
