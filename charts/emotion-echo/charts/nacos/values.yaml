# Nacos standalone subchart (Stage 31 PR-12)
# 单实例 + emptyDir 持久化（dev）；prod 改 PVC（Stage 34+）

image:
  repository: nacos/nacos-server
  tag: v2.4.3
  pullPolicy: IfNotPresent

replicas: 1

service:
  type: ClusterIP
  httpPort: 8848      # HTTP 控制台 + API
  grpcClientPort: 9848  # gRPC client（SDK 客户端连）
  grpcServerPort: 9849  # gRPC server（cluster 内部）

# JVM 资源限制（dev 友好）
jvm:
  xms: 256m
  xmx: 512m

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# 持久化：dev 默认 emptyDir（重启即清）；prod 切 PVC（Stage 34+）
persistence:
  enabled: false
  size: 1Gi

# 探针
healthcheck:
  enabled: true
  path: /nacos/actuator/health
  initialDelaySeconds: 30
  periodSeconds: 10
