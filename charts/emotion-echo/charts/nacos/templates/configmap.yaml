apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nacos.fullname" . }}-config
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
data:
  # Nacos standalone 配置（Stage 31 PR-12）
  application.properties: |
    server.port=8848
    nacos.core.auth.enabled=false
    nacos.core.auth.server.identity.key=emotion-echo-nacos
    nacos.core.auth.server.identity.value=emotion-echo
    spring.datasource.platform=derby
    # JVM 参数由 deployment env 注入（JVM_XMS / JVM_XMX）
