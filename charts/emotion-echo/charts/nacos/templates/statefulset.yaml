apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nacos.fullname" . }}
  labels:
    {{- include "nacos.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nacos.fullname" . }}-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nacos.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "nacos.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nacos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc-client
              containerPort: {{ .Values.service.grpcClientPort }}
            - name: grpc-server
              containerPort: {{ .Values.service.grpcServerPort }}
          env:
            - name: MODE
              value: standalone
            - name: JVM_XMS
              value: {{ .Values.jvm.xms }}
            - name: JVM_XMX
              value: {{ .Values.jvm.xmx }}
            - name: SPRING_DATASOURCE_PLATFORM
              value: derby
          {{- if .Values.healthcheck.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
            - name: config
              mountPath: /home/nacos/conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "nacos.fullname" . }}-config
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
