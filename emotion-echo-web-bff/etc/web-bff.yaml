# emotion-echo-web-bff 配置（Stage 30 / stage-30-web-bff.md）
#
# 端口约定（容器内）：
#   user-svc        :8888  (HTTP)
#   chat-svc        :8890  (HTTP)
#   assessment-svc  :8889  (HTTP)
#   analytics-svc   :8904  (HTTP；容器内 8893 避开 ai-svc 8892)
#   ai-svc          :8891  (HTTP) / :8892 (gRPC)
#
# 注（T1.2 阶段）：此处为真实默认值，不写 ${VAR:-default} 占位符。
# 容器 env 覆盖由 main.go applyEnvOverrides 处理（T1.3 REFACTOR 引入）。
Name: web-bff
Host: 0.0.0.0
Port: 8894

SkyWalking:
  OAPAddr:     localhost:11800
  ServiceName: emotion-echo-web-bff
  Enabled:     false

# Stage 31 PR-09: Nacos 注册中心 + 配置中心
# BFF 也注册到 Nacos（service-name=web-bff）；Stage 32 APISIX 通过
# nacos-discovery 插件自动发现 BFF 作为 upstream。
Nacos:
  Enabled:   true
  Addr:      emotion-echo-nacos:8848
  Namespace: emotion-echo-dev
  GroupName: DEFAULT_GROUP
  HotReload: false

# 下游服务地址（BFF 聚合 5 个下游 + XTTS）
UserService:
  BaseURL: http://localhost:8888
  TimeoutMs: 5000

ChatService:
  BaseURL: http://localhost:8890
  TimeoutMs: 5000

AssessmentService:
  BaseURL: http://localhost:8889
  TimeoutMs: 5000

AnalyticsService:
  BaseURL: http://localhost:8904
  TimeoutMs: 5000

AIService:
  HTTPAddr:  http://localhost:8891
  GRPCAddr:  localhost:8892
  TimeoutMs: 5000

XTTS:
  BaseURL: http://localhost:8003
  TimeoutMs: 30000

# 聚合下游 health 的超时
Health:
  TimeoutMs: 2000

# Stage 32 PR-16: BFF 自有 mock 鉴权简化为仅供 login 端点签发 token。
# JWTSecret 保留：仅用于 /api/v1/auth/login 签发 mock token。
# 真正的下游鉴权由 APISIX jwt-auth 注入 X-User-Id header 完成，BFF 不再签发也不再透传。
Auth:
  JWTSecret: dev-bff-secret
  TokenTTLSeconds: 86400

# Stage 32 PR-16: BFF 是否信任 APISIX 注入的 X-User-Id header
# true（默认）：直接读 X-User-Id，不再解析 Authorization（生产路径）
# false：本地直连 BFF 调试时回退到解析 Authorization（dev fallback）
TrustAPISIX: true

# BFF ai_stream 调用的真实 LLM（OpenAI 兼容，如 DeepSeek / OpenAI / Kimi / Ollama）
# dev 留 APIKey 空 → ai_stream 走 mock 共情回复（开发友好）
# 生产部署必填：container env BFF_LLM_API_KEY=<key>（**切勿 commit 真实 key**）
LLM:
  BaseURL: https://api.deepseek.com
  Model: deepseek-chat
  Timeout: 60
