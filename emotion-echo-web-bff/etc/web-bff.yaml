# emotion-echo-web-bff 配置（Stage 30 / stage-30-web-bff.md）
#
# 端口约定（容器内）：
#   user-svc        :8888  (HTTP) / :8887 (gRPC)
#   chat-svc        :8890  (HTTP) / :8892 (gRPC)
#   assessment-svc  :8889  (HTTP) / :8886 (gRPC)
#   analytics-svc   :8904  (HTTP；容器内 8893 避开 ai-svc 8892) / :8885 (gRPC)
#   ai-svc          :8891  (HTTP) / :8892 (gRPC)
#
# 注（T1.2 阶段）：此处为真实默认值，不写 ${VAR:-default} 占位符。
# 容器 env 覆盖由 main.go applyEnvOverrides 处理（T1.3 REFACTOR 引入）。
Name: emotion-echo-web-bff
Host: 0.0.0.0
Port: 8894

SkyWalking:
  OAPAddr:     localhost:11800
  ServiceName: emotion-echo-web-bff
  Enabled:     false

# Stage 31 PR-09: Nacos 注册中心 + 配置中心
# BFF 也注册到 Nacos（service-name=web-bff）；Stage 32 APISIX 通过
# nacos-discovery 插件自动发现 BFF 作为 upstream。
Nacos:
  Enabled:   true
  Addr:      emotion-echo-nacos:8848
  Namespace: emotion-echo-dev
  GroupName: DEFAULT_GROUP
  HotReload: false

# 下游服务地址（BFF 聚合 5 个下游 + XTTS）
# Stage 63: 每个下游新增 GRPCAddr（gRPC server 监听地址）。
#   Transport 默空 -> 走 gRPC（需 GRPCAddr 非空 + dial 成功）；设 "http" 强制 HTTP 回滚。
UserService:
  BaseURL: http://localhost:8888
  GRPCAddr: localhost:8887
  TimeoutMs: 5000

ChatService:
  BaseURL: http://localhost:8890
  GRPCAddr: localhost:8892
  TimeoutMs: 5000

AssessmentService:
  BaseURL: http://localhost:8889
  GRPCAddr: localhost:8886
  TimeoutMs: 5000

AnalyticsService:
  BaseURL: http://localhost:8904
  GRPCAddr: localhost:8885
  TimeoutMs: 5000

AIService:
  HTTPAddr:  http://localhost:8891
  GRPCAddr:  localhost:8892
  # E2E-F-115（2026-09-22）：原 5000（5s）在 dev 模式首语音必撞 504（SenseVoice 冷启动
  # ffmpeg 解码 + 首次张量分配 ≈5~15s）。改 30000（30s）容纳冷启动，与 ai.go newAIHTTPClient
  # 默认 30s + ai_grpc.go aiGRPCDefaultDeadline 对齐。
  TimeoutMs: 30000

XTTS:
  BaseURL: http://localhost:8003
  # E2E-F-127（2026-09-23 e2e-17 step 5 收口实测）：仓 XTTS 模型 CPU 推理 4 字符 ~7s，
  # 按字符数线性放大。E2E-17 数字人 + TTS plan §2.A.3 实测：1 字 warm path ~16-20s，
  # 30s 不够 cold path + warm path 长文本。原 yaml 30000 与 config.go SetDefaults
  # 默认 90000 漂移 → yaml 实际生效 30s → BFF→XTTS client.Timeout 30s 撞底 → 502。
  # 修法：yaml 与 config.go 一致 90000；测试钉 config_test.go:TestConfig_XTTSDefaultTimeoutIs90s。
  TimeoutMs: 90000

# 聚合下游 health 的超时
Health:
  TimeoutMs: 2000

# Stage 33 PR-19b: BFF 真实登录（user-svc bcrypt 校验）+ JWTSecret 仅用于 sign JWT 给前端用。
# JWTSecret 必须与 APISIX jwt-auth secret 同源（部署时通过 env 注入同步）。
#
# Stage 94 PR-5 §P0-10：移除 JWTSecret: dev-bff-secret 默认值。dev 密钥进生产
# 会让攻击者可伪造任意 user_id token。部署时必须显式通过 env 注入：
#   export BFF_JWT_SECRET=$(openssl rand -hex 32)
# 或在 compose override 里设 JWTSecret: <生产密钥>。
# 未注入时 main.go 调 auth.NewManager(secret, ttl) 时 NewManager 内部
# fail-fast + log.Fatal,避免 dev 密钥进生产。
Auth:
  JWTSecret: ""
  TokenTTLSeconds: 86400

# Stage 32 PR-16: BFF 是否信任 APISIX 注入的 X-User-Id header
# true：直接读 X-User-Id，不再解析 Authorization（生产路径；必须配 APISIXCIDRs 防伪造）
# false：本地直连 BFF 调试时回退到任何 X-User-Id 都接受（dev fallback）
#
# Sprint 109a：默认改 false（dev 模式默认）。Stage 94 PR-6 §P0-7 要求
# TrustAPISIX=true 时必须配 APISIXCIDRs（k8s pod CIDR），否则 BFF 端口被外部直连
# 时攻击者可伪造 X-User-Id header 假冒任意用户。dev 模式无 k8s pod CIDR 可配，
# 走 TrustAPISIX=false 简化 dev 鉴权链。prod 部署必须改回 true + 配 CIDR。
#
# APISIXCIDRs 通过 env BFF_APISIX_CIDRS 注入（部署时按实际 k8s Network CIDR 填）。
# dev 环境（TrustAPISIX=false）APISIXCIDRs 留空即可。
TrustAPISIX: false
# APISIXCIDRs: []

# BFF ai_stream 调用的真实 LLM（OpenAI 兼容，如 DeepSeek / OpenAI / Kimi / Ollama）
# dev 留 APIKey 空 -> ai_stream 走 mock 共情回复（开发友好）
# 生产部署必填：container env BFF_LLM_API_KEY=<key>（切勿 commit 真实 key）
LLM:
  BaseURL: https://api.deepseek.com
  Model: deepseek-chat
  Timeout: 60

# Sprint 1 PR-4b: MinIO 对象存储（PR-4c avatar_handler 写这里）
# dev 默认连 compose 内的 emotion-echo-minio:9000；
# prod 必须用 env 覆盖 Endpoint + AccessKey + SecretKey + PublicBaseURL
MinIO:
  Endpoint: emotion-echo-minio:9000
  AccessKey: minioadmin
  SecretKey: minioadmin
  Bucket: avatars
  UseSSL: false
  PublicBaseURL: http://localhost:9000
